<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111">
<title>SIGMON</title>
<style>
html,body{margin:0;background:#111;color:#ddd;font-family:monospace;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
canvas{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;display:block}
#pad{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 18px 8px;box-sizing:border-box}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:2px}
.btn{background:#2c2c34;border:2px solid #4a4a58;border-radius:10px;color:#ccc;font:bold 15px monospace;display:flex;align-items:center;justify-content:center;touch-action:none}
.btn.on{background:#55556a}
.ab{display:flex;gap:14px;align-items:center}
.round{width:66px;height:66px;border-radius:50%;font-size:20px}
.a{background:#7a2030;border-color:#a03045}
.mid{display:flex;justify-content:center;width:100%;padding-bottom:10px}
.start{padding:8px 22px;border-radius:20px;font-size:12px}
#help{font-size:12px;color:#888;padding:8px 10px 14px;text-align:center;line-height:1.6}
@media (hover:hover) and (pointer:fine){#pad,.mid{display:none}}
</style>
</head>

    </div>
    <div class="ab">
      <div class="btn round" data-b="b">B</div>
      <div class="btn round a" data-b="a">A</div>
    </div>
  </div>
  <div class="mid"><div class="btn start" data-b="start">MENU</div></div>

const NOSHADE='weom';
function hex2rgb(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function rgb2hex(r){return'#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
const mix=(a,b,t)=>{const x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(x.map((v,i)=>v+(y[i]-v)*t))};
const lum=h=>{const[r,g,b]=hex2rgb(h);return(.3*r+.59*g+.11*b)/255};
function buildSprite(art,variant){
 const rows=art.g,Wd=Math.max(...rows.map(r=>r.length)),Hd=rows.length;
 const grid=rows.map(r=>r.padEnd(Wd,'.'));
 const pal=Object.assign({w:'#ffffff',e:'#1a1a2e',m:'#7a1f2b',o:'#1a1a1a'},art.p);
 let outline='#1a1a1a';
 const col=k=>{let c=pal[k];if(!c)return null;
  if(variant==='l'){if(k==='w')return'#fffbe0';if('ayrp'.includes(k))return mix(c,'#ffd23f',.6)}
  if(variant==='s'){if(k==='w')return'#ffffff';if(k==='e'||k==='y'&&art.p.e)return'#ff1744';if(k==='m')return'#0a0a14';
   if('ayrp'.includes(k))return mix('#b88a00','#ffe066',lum(c));
   return mix('#14142a','#5a5e85',lum(c))}
  return c};
 if(variant==='l')outline='#7a4a00';if(variant==='s')outline='#ffd700';
 const cv=document.createElement('canvas');cv.width=Wd+2;cv.height=Hd+2;const g=cv.getContext('2d');
 const at=(x,y)=>x>=0&&y>=0&&x<Wd&&y<Hd&&grid[y][x]!=='.';
 for(let y=-1;y<=Hd;y++)for(let x=-1;x<=Wd;x++){
  let c=null;
  if(at(x,y)){const k=grid[y][x];c=k==='o'?outline:col(k);
   if(c&&!NOSHADE.includes(k)){
    const below=!at(x,y+1)||grid[y+1][x]==='o',above=!at(x,y-1),right=!at(x+1,y);
    if(below||(right&&y>Hd*.45))c=mix(c,'#000000',.28);
    else if(above||!at(x-1,y))c=mix(c,'#ffffff',.3);
   }}
  else if(at(x+1,y)||at(x-1,y)||at(x,y+1)||at(x,y-1))c=outline;
  if(c){g.fillStyle=c;g.fillRect(x+1,y+1,1,1)}
 }
 return cv;
}

async function bagBattle(){
 const ks=Object.keys(items).filter(k=>items[k]>0);
 if(!ks.length){await say('Sua bolsa está vazia!');return 'cancel'}
 const i=await choose(ks.map(k=>({t:ITEMS[k].n,tag:'x'+items[k]})),{x:110,y:40,w:126});
 if(i<0)return 'cancel';
 const k=ks[i],it=ITEMS[k];
 if(it.ball)return(await tryCatch(k))?'caught':'used';

async function giveXp(c,amt){

  const o=st(c);c.lvl++;const n=st(c);c.hp+=n.hp-o.hp;c.leveled=true;sfx('lvl');
  if(B)B.mHp=c.hp;

  }
 }
}

 ctx.save();ctx.font=FONT(30);ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle='#000';ctx.fillText('SIGMON',122,14);
 ctx.fillStyle=`hsl(${frame*3%360},90%,60%)`;ctx.fillText('SIGMON',120,12);ctx.restore();
 txt('Capture. Evolua. Ache o SIGMA.',120,44,'#ddd',7,'center');
 const demo=[[0,2],[10,5],[4,4]];demo.forEach(([sp,r],i)=>drawMon({sp,rar:r},55+i*65,100+Math.sin(frame*.06+i)*3,2.5,false));
}
function renderStarter(){
 ctx.fillStyle='#f3ecd9';fr(0,0,240,160);ctx.fillStyle='#e04a4a';fr(0,0,240,18);txt('Escolha seu primeiro monstrinho!',120,5,'#fff',8,'center');
 const idx=ui.menu&&ui.menu.hidden?ui.menu.idx:STARTER_IDX;
 [0,2,4].forEach((sp,i)=>{const x=45+i*75,sel=i===idx;
  ctx.fillStyle=sel?'#ffe9a8':'#e6dcc4';fr(x-32,26,64,80);
  drawMon({sp,rar:0},x,90+(sel?Math.round(Math.sin(frame*.2)*2):0),3,false);
  txt(SP[sp].n,x,94,'#222',8,'center');txt(SP[sp].t,x,103-8+18,TYPES[SP[sp].t].s,7,'center');
  if(sel){ctx.fillStyle='#e04a4a';fr(x-4,22,9,2);fr(x-2,24,5,2)}});
}
function renderEvo(){
 ctx.fillStyle='#101020';fr(0,0,240,160);
 if(!EV)return;EV.t++;
 let sp=EV.done?EV.to:EV.from;
 if(EV.anim&&!EV.done){const per=Math.max(2,Math.floor(24-EV.t/7));sp=Math.floor(EV.t/per)%2?EV.to:EV.from;
  ctx.fillStyle=`rgba(255,255,255,${.1+.1*Math.sin(EV.t*.3)})`;fr(0,0,240,160)}
 drawMon({sp,rar:EV.c.rar},120,95,4,false);
}
let STARTER_IDX=0;
function render(){
 ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=false;
 if(state==='title')renderTitle();
 else if(state==='starter')renderStarter();
 else if(state==='evo')renderEvo();
 else if(state==='battle'&&B)renderBattle();
 else renderWorld();
 const m=ui.menu;
 if(state!=='battle'){
  if(ui.msg)msgBox(ui.msg.slice(0,ui.shown));
  else if(m&&m.prompt)msgBox(m.prompt,m.y>=112?m.x-14:216);
 }
 if(ui.view&&ui.view.c)renderDetail(ui.view.c);
 if(m)drawMenu(m);
 if(ui.msg&&ui.shown>=ui.msg.length&&!ui.auto&&(frame>>4)%2){ctx.fillStyle='#c03030';fr(228,150,5,2);fr(229,152,3,1);fr(230,153,1,1)}
}
function update(){
 frame++;
 if(ui.msg){if(ui.shown<ui.msg.length)ui.shown=Math.min(ui.msg.length,ui.shown+2);else if(ui.auto){if(--ui.auto<=0&&ui.msgDone)ui.msgDone()}}
 for(let i=waiters.length-1;i>=0;i--){if(waiters[i].fn()){const w=waiters.splice(i,1)[0];w.r()}}
 updateWorld();
}
function loop(){update();render();requestAnimationFrame(loop)}

// ================= INÍCIO =================
async function main(){
 state='title';
 let has=false;try{has=!!localStorage.getItem(SAVE_KEY)}catch(e){}
 const opts=has?['CONTINUAR','NOVO JOGO']:['NOVO JOGO'];
 const i=await choose(opts,{x:78,y:128,w:84,cancel:false});
 if(has&&i===0&&load()){state='world';lastReg=(regionAt(P.x,P.y)||{}).n||null;toast('Bem-vindo de volta!');return}
 if(has){const c=await choose(['NÃO','SIM'],{x:186,y:60,w:50,cancel:false,prompt:'Começar de novo apaga o jogo salvo. Continuar?'});if(c!==1)return main()}
 newGame();
 await say('Bem-vindo ao mundo de SIGMON!');
 await say('Aqui vivem monstrinhos de 6 raridades: Comum, Incomum, Raro, Épico, Lendário... e o lendário SIGMA.');
 await say('Um SIGMA é tão raro que aparece cerca de 1 vez a cada 250 encontros. Ele brilha em dourado e tem um golpe exclusivo!');
 state='starter';
 let sp;
 while(true){
  const k=await choose(['Brasinho','Gotinho','Brotim'],{cols:3,hidden:true,cancel:false});
  STARTER_IDX=k;sp=[0,2,4][k];
  const c=await choose(['SIM','NÃO'],{x:186,y:60,w:50,cancel:false,prompt:`Escolher ${SP[sp].n}, do tipo ${SP[sp].t}?`});
  if(c===0)break;
 }
 const st0=mk(sp,5);team.push(st0);dexCatch(sp,st0.rar);
 if(st0.rar>0){sfx(st0.rar===5?'sigma':'catch');await say(`UAU! Seu ${SP[sp].n} é ${RAR[st0.rar].n}!`)}
 else await say(`Você e ${SP[sp].n} são parceiros agora!`);
 state='world';
 await say('Ande pelo MATO ALTO para encontrar monstrinhos. A porta do Centro (atrás de você) cura e vende cápsulas.');
 await say('Quanto mais longe, mais fortes e mais raros. A Mata Sombria (nordeste) tem mais chance de raridade alta!');
 save();
}
loop();main();
</script>
