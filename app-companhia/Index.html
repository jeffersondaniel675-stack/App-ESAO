<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema da Companhia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap">
<style>
:root {
  /* Padrão Digital de Governo (gov.br DS): azul institucional, cinzas neutros, faixa amarela; tipografia Raleway (base da Rawline). */
  --azul: #1351b4; --azul-escuro: #0c326f; --marinho: #071d41; --azul-claro: #dbe8fb; --ouro: #ffcd07; --foco: #c2850c;
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f8f8f8; --cinza-5: #ededed; --border: #cccccc; --campo: #888888;
  --text: #333333; --muted: #636363; --on-azul: #ffffff;
  --menu-1: #ededed; --menu-2: #f8f8f8; --menu-fundo: rgba(237, 237, 237, .94); --menu-on: #071d41; --menu-on-fg: #ffffff; --menu-hover: #1351b4;
  --danger: #e52207; --warn: #8a6100; --ok: #168821; --info: #155bcb;
  --preta: #333333; --vermelha: #e52207;
  --shadow: 0 1px 6px rgba(51, 51, 51, .16);
  --fonte: "Raleway", "Rawline", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --azul: #5992ed; --azul-escuro: #81aef0; --marinho: #c5d4eb; --azul-claro: #1b3566; --ouro: #ffcd07; --foco: #ffcd07;
    --bg: #0b1730; --surface: #10203f; --surface-2: #142749; --cinza-5: #1a3058; --border: #2c4373; --campo: #6f84ad;
    --text: #e6ecf7; --muted: #a8b5ce; --on-azul: #071d41;
    --menu-1: #13254a; --menu-2: #182d58; --menu-fundo: rgba(7, 18, 40, .9); --menu-on: #dbe8fb; --menu-on-fg: #071d41; --menu-hover: #5992ed;
    --danger: #ff7a66; --warn: #ffcd07; --ok: #4dc966; --info: #81aef0;
    --preta: #e6ecf7; --vermelha: #ff7a66; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --azul: #5992ed; --azul-escuro: #81aef0; --marinho: #c5d4eb; --azul-claro: #1b3566; --ouro: #ffcd07; --foco: #ffcd07;
  --bg: #0b1730; --surface: #10203f; --surface-2: #142749; --cinza-5: #1a3058; --border: #2c4373; --campo: #6f84ad;
  --text: #e6ecf7; --muted: #a8b5ce; --on-azul: #071d41;
  --menu-1: #13254a; --menu-2: #182d58; --menu-fundo: rgba(7, 18, 40, .9); --menu-on: #dbe8fb; --menu-on-fg: #071d41; --menu-hover: #5992ed;
  --danger: #ff7a66; --warn: #ffcd07; --ok: #4dc966; --info: #81aef0;
  --preta: #e6ecf7; --vermelha: #ff7a66; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--fonte); font-feature-settings: "lnum" 1; }
a { color: var(--azul); }
button, input, select, textarea { font: inherit; color: inherit; font-feature-settings: "lnum" 1; }
:focus-visible { outline: 3px dashed var(--foco); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; flex: none; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- cabeçalho no padrão gov.br */
header.hdr { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 2px solid var(--ouro); box-shadow: var(--shadow); }
.hdr-top { display: flex; align-items: center; gap: 16px; padding-block: 12px 4px; }
.marca { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--text); cursor: pointer; min-width: 0; }
.sigla { font-weight: 800; font-size: 24px; letter-spacing: -.5px; color: var(--azul-escuro); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.sigla svg { width: 26px; height: 26px; color: var(--azul); }
.marca .sep, .vsep { width: 1px; align-self: stretch; background: var(--border); min-height: 32px; }
.org { font-size: 13px; line-height: 1.35; max-width: 260px; }
.links { display: flex; gap: 20px; font-size: 14px; font-weight: 600; }
.links a { text-decoration: none; cursor: pointer; white-space: nowrap; }
.links a:hover { text-decoration: underline; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px; border-radius: 100em; border: 1px solid var(--azul); background: var(--azul); color: var(--on-azul); font-weight: 600; font-size: 15px; cursor: pointer; white-space: nowrap; }
.pill.out { background: var(--surface); color: var(--azul); }
.pill:hover { filter: brightness(1.1); } .pill.out:hover { background: var(--azul-claro); filter: none; }
.pop-wrap { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 8px); background: var(--surface); border-radius: 8px; box-shadow: 0 4px 18px rgba(0,0,0,.2); padding: 8px 0; min-width: 240px; z-index: 40; border: 1px solid var(--border); }
.pop button, .pop a { display: block; width: 100%; text-align: left; padding: 9px 16px; background: none; border: 0; cursor: pointer; color: var(--azul); font-weight: 500; text-decoration: none; }
.pop button:hover, .pop a:hover { background: var(--azul-claro); }
.pop .info { padding: 6px 16px 10px; border-bottom: 1px solid var(--border); margin-bottom: 4px; font-size: 13px; color: var(--muted); }
.pop .info b { display: block; color: var(--text); font-size: 15px; }
.hdr-bot { display: flex; align-items: center; gap: 12px; padding-block: 10px 14px; }
.hamb { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--azul); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.hamb:hover { background: var(--azul-claro); }
.hamb svg { width: 22px; height: 22px; }
.sistema { font-size: 24px; font-weight: 400; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.busca { display: flex; align-items: center; background: var(--cinza-5); border-radius: 6px; height: 48px; width: min(345px, 100%); padding: 0 6px 0 16px; }
.busca input[type=search] { border: 0; border-radius: 0; background: none; flex: 1; min-width: 0; height: 100%; font-style: italic; padding: 0; }
.busca input:focus { outline: none; }
.busca:focus-within { outline: 3px dashed var(--foco); outline-offset: 2px; }
.busca button { width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; color: var(--azul); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.busca button:hover { background: var(--azul-claro); }
.grow { flex: 1; }

/* ---------- menu principal (duas colunas, como o menu do gov.br) */
.menu { position: absolute; left: 0; right: 0; top: 100%; height: calc(100vh - var(--hdr-h, 160px)); background: var(--menu-fundo); display: flex; overflow: hidden; }
.menu .col { overflow-y: auto; padding-block: 24px; }
.menu .c1 { width: max(300px, calc((100vw - 1280px) / 2 + 280px)); padding-left: max(16px, calc((100vw - 1280px) / 2 + 16px)); background: var(--menu-1); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.menu .c2 { width: 280px; background: var(--menu-2); padding-inline: 4px; }
.menu .it { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; color: var(--text); padding: 6px 12px; font-size: 15.5px; line-height: 1.35; cursor: pointer; min-height: 34px; }
.menu .c1 .it:hover, .menu .c1 .it.aberto { background: var(--menu-hover); color: #fff; }
.menu .c1 .it.on { background: var(--menu-on); color: var(--menu-on-fg); }
.menu .c2 .it { color: var(--muted); }
.menu .c2 .it:hover { color: var(--azul); text-decoration: underline; }
.menu .c2 .it.on { color: var(--text); font-weight: 700; }
.menu .c2 .tit { font-weight: 700; color: var(--text); padding: 0 12px 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; display: flex; align-items: center; gap: 6px; }
.menu .chev { font-size: 18px; line-height: 1; opacity: .8; }
.menu .rodape { margin-top: auto; border-top: 1px solid var(--border); padding: 18px 12px 0; margin-right: 0; color: var(--muted); font-size: 13px; }
.menu .rodape .sigla { color: var(--muted); font-size: 22px; }
.menu .voltar { display: none; }

/* ---------- conteúdo */
main { padding-block: 16px 64px; min-height: 60vh; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); margin-bottom: 18px; }
.crumb a { cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.crumb a:hover { text-decoration: underline; }
.crumb .sep { font-size: 16px; color: var(--muted); }
h2 { margin: 0 0 6px; font-size: 28px; font-weight: 600; color: var(--text); text-wrap: balance; }
h3 { margin: 22px 0 10px; font-size: 18px; font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 20px; max-width: 75ch; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
.bar .grow { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 20px; border-radius: 100em; border: 1px solid var(--azul); background: var(--surface); color: var(--azul); font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--azul-claro); }
.btn.pri { background: var(--azul); color: var(--on-azul); }
.btn.pri:hover { background: var(--azul-escuro); border-color: var(--azul-escuro); }
.btn.dng { color: var(--danger); border-color: var(--danger); }
.btn.sm { height: 30px; padding: 0 14px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=date], input[type=number], input[type=month], input[type=email], input[type=search], select, textarea {
  height: 40px; padding: 0 12px; border: 1px solid var(--campo); border-radius: 6px; background: var(--surface); width: 100%; min-width: 0;
}
textarea { height: auto; padding: 8px 12px; min-height: 90px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13.5px; }
input[type=file] { max-width: 100%; }
.bar input, .bar select { width: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-bottom: 20px; }
.card { background: var(--surface); border-radius: 8px; padding: 16px 18px; box-shadow: var(--shadow); border: 1px solid var(--cinza-5); min-width: 0; }
.card h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.big { font-size: 32px; font-weight: 700; line-height: 1.1; color: var(--azul-escuro); }
.list { margin: 0; padding: 0; list-style: none; }
.list li { padding: 6px 0; border-bottom: 1px solid var(--cinza-5); display: flex; gap: 8px; justify-content: space-between; }
.list li:last-child { border-bottom: 0; }
.list li .tag { white-space: normal; text-align: right; }
.tw { overflow-x: auto; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); border: 1px solid var(--cinza-5); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--cinza-5); text-align: left; vertical-align: top; }
th { background: var(--surface-2); font-size: 13px; font-weight: 700; color: var(--text); position: sticky; top: 0; border-bottom: 2px solid var(--border); }
tbody tr:hover td { background: color-mix(in srgb, var(--azul-claro) 45%, transparent); }
tr:last-child td { border-bottom: 0; }
td.acts { white-space: nowrap; text-align: right; }
.num { text-align: right; font-variant-numeric: tabular-nums lining-nums; }
.tag { display: inline-block; padding: 2px 10px; border-radius: 100em; font-size: 12.5px; font-weight: 600; background: var(--cinza-5); color: var(--muted); white-space: nowrap; }
.tag.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.tag.warn { color: var(--warn); background: color-mix(in srgb, var(--ouro) 22%, transparent); }
.tag.dng { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
.tag.info { color: var(--info); background: color-mix(in srgb, var(--info) 12%, transparent); }
.tag.preta { background: var(--preta); color: var(--surface); } .tag.vermelha { background: var(--vermelha); color: #fff; }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 18px; cursor: pointer; border-bottom: 4px solid transparent; color: var(--muted); white-space: nowrap; font-weight: 600; margin-bottom: -1px; }
.tabs button:hover { color: var(--azul); background: var(--azul-claro); }
.tabs button.on { color: var(--azul); border-bottom-color: var(--azul); }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.escala td { padding: 4px 6px; }
.escala td.dia { white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 12px; }
.escala tr.v td.dia { color: var(--vermelha); font-weight: 700; }
.escala tr.hoje td { background: color-mix(in srgb, var(--ouro) 18%, transparent); }
.escala select { height: 34px; padding: 0 8px; font-size: 14px; min-width: 160px; }
.alerta { color: var(--warn); cursor: help; }
.modal-bg { position: fixed; inset: 0; background: rgba(7, 29, 65, .55); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 8px; width: 100%; max-width: 680px; padding: 20px 24px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.modal h3 { margin-top: 0; font-size: 20px; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--text); font-weight: 600; min-width: 0; }
.form .full { grid-column: 1 / -1; }
.form .req::after { content: " *"; color: var(--danger); }
.checks { max-height: 220px; overflow-y: auto; border: 1px solid var(--campo); border-radius: 6px; padding: 6px 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 10px; font-weight: 400; color: var(--text); }
.checks label { flex-direction: row; align-items: center; font-weight: 400; color: var(--text); gap: 6px; }
.modal .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
#toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
#toast div { background: var(--marinho); color: var(--bg); padding: 10px 18px; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: 90vw; }
#toast div.err { background: var(--danger); color: #fff; }
.loading { padding: 60px; text-align: center; color: var(--muted); }
.ad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.ad-grid label { display: flex; flex-direction: column; gap: 4px; }
.parte { margin-top: 16px; }
.parte .bar { margin-bottom: 6px; }
.demo { background: var(--ouro); color: #071d41; font-size: 13px; font-weight: 600; padding: 5px 16px; text-align: center; }
.muted { color: var(--muted); }
.right { text-align: right; }
.res h3 { display: flex; gap: 8px; align-items: center; }
#print { display: none; }
@media (max-width: 1000px) {
  .links, .hdr-top > .vsep { display: none; }
}
@media (max-width: 760px) {
  .hdr-top { gap: 10px; }
  .org, .marca .sep { display: none; }
  .pill .lbl { display: none; }
  .pill { padding: 0 10px; }
  .hdr-bot { flex-wrap: wrap; padding-block: 6px 12px; }
  .sistema { font-size: 20px; flex: 1; }
  .hdr-bot .grow { display: none; }
  .busca { width: 100%; height: 42px; }
  .menu .c1 { width: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .menu .c2 { display: none; width: 100%; }
  .menu.nivel2 .c1 { display: none; }
  .menu.nivel2 .c2 { display: block; }
  .menu .voltar { display: flex; color: var(--azul); font-weight: 600; }
  h2 { font-size: 24px; }
  .form, .ad-grid { grid-template-columns: 1fr; }
}
@media print {
  body { background: #fff; color: #000; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; font: 12pt/1.5 "Times New Roman", serif; color: #000; }
  #print table { font-size: 10pt; }
  #print th, #print td { border: 1px solid #000; padding: 3px 6px; color: #000; background: none; position: static; }
  #print .c { text-align: center; } #print .b { font-weight: bold; } #print .r { text-align: right; }
  #print p { margin: 0 0 6px; text-align: justify; white-space: pre-wrap; }
  @page { margin: 18mm 15mm 18mm 25mm; }
}
</style>
</head>
<body>
<div id="demo-bar" class="demo" hidden>Modo demonstração — os dados ficam só neste navegador. Publique no Google Apps Script para usar a planilha.</div>
<header class="hdr" id="hdr">
  <div class="wrap">
    <div class="hdr-top">
      <a class="marca" onclick="irPara('painel')" title="Início"><span class="sigla" id="sigla"></span><span class="sep"></span><span class="org" id="org"></span></a>
      <span class="grow"></span>
      <nav class="links" aria-label="Acesso rápido"><a onclick="irPara('painel')">Painel</a><a onclick="irPara('escala')">Escala</a><a onclick="irPara('arquivo')">Arquivo PDF</a></nav>
      <span class="vsep"></span>
      <div class="pop-wrap"><button class="pill out" id="btnAtalhos" onclick="abrirPop('atalhos', event)" aria-haspopup="true"><i data-ico="grade"></i><span class="lbl">Atalhos</span></button><div class="pop" id="pop-atalhos" hidden></div></div>
      <div class="pop-wrap"><button class="pill" id="btnUser" onclick="abrirPop('user', event)" aria-haspopup="true"><i data-ico="user"></i><span class="lbl" id="user">Entrando…</span></button><div class="pop" id="pop-user" hidden></div></div>
    </div>
    <div class="hdr-bot">
      <button class="hamb" id="hamb" onclick="alternarMenu()" aria-label="Abrir menu" aria-expanded="false"></button>
      <span class="sistema" id="titulo">Sistema da Companhia</span>
      <span class="grow"></span>
      <form class="busca" role="search" onsubmit="buscar(event)"><input type="search" id="q" placeholder="O que você procura?" aria-label="Buscar no sistema"><button aria-label="Buscar"><i data-ico="lupa"></i></button></form>
    </div>
  </div>
  <div id="menu"></div>
</header>
<main id="main" class="wrap"><div id="crumb"></div><div id="app"><div class="loading">Carregando dados da planilha…</div></div></main>
<div id="modal"></div>
<div id="dialog"></div>
<div id="toast"></div>
<div id="print"></div>

<script>
// ============================================================ utilidades
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const isoDe = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dataDe = iso => new Date(iso + 'T12:00:00');
const hoje = () => isoDe(new Date());
const addDias = (iso, n) => { const d = dataDe(iso); d.setDate(d.getDate() + n); return isoDe(d); };
const MESES = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
const MESES_EXT = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const SEMANA = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const SEM_CURTA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const fmt = iso => iso ? iso.split('-').reverse().join('/') : '';
const fmtMil = iso => { if (!iso) return ''; const d = dataDe(iso); return `${pad(d.getDate())} ${MESES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`; };
const fmtExt = iso => { const d = dataDe(iso); return `${d.getDate()} de ${MESES_EXT[d.getMonth()]} de ${d.getFullYear()}`; };
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const sim = v => !/^(n|nao|não|false|0|inativo)$/i.test(String(v ?? 'Sim').trim());
const ids = v => String(v ?? '').split(',').map(s => s.trim()).filter(Boolean);
const uid = () => Math.random().toString(36).slice(2, 10);

function toast(msg, erro) {
  const el = document.createElement('div');
  el.textContent = msg; if (erro) el.className = 'err';
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), erro ? 6000 : 3000);
}

const svg = d => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

const Demo = {
  KEY: 'sistema-cia-demo-v1',
  ler() { try { return JSON.parse(localStorage.getItem(this.KEY)); } catch (e) { return null; } },
  gravar(db) { try { localStorage.setItem(this.KEY, JSON.stringify(db)); } catch (e) { /* sem armazenamento: segue só em memória */ } this.mem = db; },
  db() { return this.mem || this.ler() || (this.mem = semente()); },

  async salvarLote(t, lista, excluir) {

let MIL = {}, MAT = {}, TIPO = {}, FERIADO = {}, ESC_DIA = {};
function indexar() {
  MIL = Object.fromEntries(S.db.Militares.map(m => [m.id, m]));
  MAT = Object.fromEntries(S.db.Material.map(m => [m.id, m]));
  TIPO = Object.fromEntries(S.db.TiposServico.map(t => [t.id, t]));
  FERIADO = Object.fromEntries(S.db.Feriados.map(f => [f.data, f.descricao]));
  ESC_DIA = {};
  S.db.Escala.forEach(e => { (ESC_DIA[e.data] ||= []).push(e); });
}
const postoIdx = p => { const i = POSTOS.indexOf(p); return i < 0 ? 99 : i; };
const nomeMil = m => { m = typeof m === 'string' ? MIL[m] : m; return m ? [m.postoGrad, m.numero, m.nomeGuerra].filter(Boolean).join(' ') : '—'; };
const ordemMil = (a, b) => postoIdx(a.postoGrad) - postoIdx(b.postoGrad) || num(a.antiguidade) - num(b.antiguidade) || String(a.nomeGuerra).localeCompare(b.nomeGuerra);
const militaresAtivos = () => S.db.Militares.filter(m => sim(m.ativo)).sort(ordemMil);
const tiposAtivos = () => S.db.TiposServico.filter(t => sim(t.ativo)).sort((a, b) => num(a.ordem) - num(b.ordem));
const corDoDia = iso => { const w = dataDe(iso).getDay(); return (w === 0 || w === 6 || FERIADO[iso]) ? 'V' : 'P'; };
const missaoAtiva = m => m.status !== 'Cancelada' && m.status !== 'Concluída';

/** Situação do militar numa data: impedimento, missão ou pronto. */
function situacao(militarId, iso) {
  const imp = S.db.Impedimentos.find(i => i.militarId === militarId && i.inicio <= iso && (i.fim || i.inicio) >= iso);
  if (imp) return { tipo: 'imp', texto: imp.tipo, ate: imp.fim };
  const mis = S.db.Missoes.find(m => m.status !== 'Cancelada' && ids(m.militaresIds).concat(m.responsavelId || []).includes(militarId) && m.inicio <= iso && (m.fim || m.inicio) >= iso);
  if (mis) return { tipo: 'missao', texto: 'Missão: ' + mis.titulo, ate: mis.fim };
  return { tipo: 'pronto', texto: 'Pronto' };
}
const tagSituacao = s => `<span class="tag ${s.tipo === 'pronto' ? 'ok' : s.tipo === 'missao' ? 'info' : 'warn'}">${esc(s.texto)}${s.ate ? ' até ' + fmt(s.ate) : ''}</span>`;
const aptoPara = (m, tipo) => ids(tipo.postos).includes(m.postoGrad);

/**
 * Folga = quantidade de dias da mesma cor (preta = dias úteis, vermelha = sáb/dom/feriado)
 * desde o último serviço do militar naquele tipo de serviço. Quem nunca tirou tem folga infinita.
 */
function calcFolga(militarId, tipoId, cor, iso, entradas) {
  let ultimo = null;
  for (const e of entradas) if (e.militarId === militarId && e.tipoId === tipoId && corDoDia(e.data) === cor && e.data < iso && (!ultimo || e.data > ultimo)) ultimo = e.data;
  if (!ultimo) return { folga: Infinity, ultimo: null };
  let n = 0;
  for (let d = addDias(ultimo, 1); d < iso; d = addDias(d, 1)) if (corDoDia(d) === cor) n++;
  return { folga: n, ultimo };
}

/**
 * Preenche os serviços vazios entre `inicio` e `fim` escolhendo, para cada dia e tipo,
 * o militar apto e disponível com maior folga na cor do dia. Empate: o mais moderno.
 * Regras: não escala impedido/em missão, nem em dois serviços no mesmo dia, nem em dias seguidos.
 */
function gerarEscala(inicio, fim, existentes) {
  const entradas = existentes.slice();
  const ocupado = new Set(entradas.map(e => e.militarId + '|' + e.data));
  const novos = [], faltas = [];
  for (let d = inicio; d <= fim; d = addDias(d, 1)) {
    const cor = corDoDia(d);
    for (const tipo of tiposAtivos()) {
      if (entradas.some(e => e.data === d && e.tipoId === tipo.id)) continue;
      const cands = militaresAtivos().filter(m => aptoPara(m, tipo)
        && situacao(m.id, d).tipo === 'pronto'
        && !ocupado.has(m.id + '|' + d) && !ocupado.has(m.id + '|' + addDias(d, -1)) && !ocupado.has(m.id + '|' + addDias(d, 1)));
      if (!cands.length) { faltas.push(`${fmt(d)} – ${tipo.nome}`); continue; }
      const escolhido = cands.map(m => ({ m, f: calcFolga(m.id, tipo.id, cor, d, entradas).folga }))
        .sort((a, b) => b.f - a.f || postoIdx(b.m.postoGrad) - postoIdx(a.m.postoGrad) || num(b.m.antiguidade) - num(a.m.antiguidade))[0].m;
      const e = { id: uid(), data: d, tipoId: tipo.id, militarId: escolhido.id, cor, obs: '' };
      entradas.push(e); novos.push(e); ocupado.add(escolhido.id + '|' + d);
    }
  }
  return { novos, faltas };
}

function alertasEscala(e) {
  const a = [];
  const s = situacao(e.militarId, e.data);
  if (s.tipo !== 'pronto') a.push(s.texto);
  const doMil = S.db.Escala.filter(x => x.militarId === e.militarId && x.id !== e.id);
  if (doMil.some(x => x.data === e.data)) a.push('dois serviços no mesmo dia');
  if (doMil.some(x => x.data === addDias(e.data, -1) || x.data === addDias(e.data, 1))) a.push('serviço em dias seguidos');
  return a;
}

  } else if (c.t === 'militar') {
    input = `<select id="${id}" ${req}><option value=""></option>${militaresAtivos().map(m => `<option value="${m.id}" ${m.id === val ? 'selected' : ''}>${esc(nomeMil(m))}</option>`).join('')}</select>`;

  } else if (c.t === 'textarea') {
    input = `<textarea id="${id}" ${req}>${esc(val)}</textarea>`;

    input = `<input type="file" id="${id}">${val ? `<small><a href="${esc(val)}" target="_blank">arquivo atual</a></small>` : ''}`;
  } else {

}

function lerArquivoBase64(file) {

  $('#frm').onsubmit = async ev => {

    try {
      const obj = { ...valores };

        const el = $('#f_' + c.k);

  escala: [{ l: 'Escala do mês', aba: 'mes' }, { l: 'Quadro de folgas', aba: 'folgas' }],
  missoes: [{ l: 'Planejadas e em andamento', filtro: ['missaoStatus', 'ativas'] }, { l: 'Concluídas', filtro: ['missaoStatus', 'Concluída'] }, { l: 'Todas as missões', filtro: ['missaoStatus', 'todas'] }, { l: 'Nova missão', acao: () => editarMissao(), editor: true }],
  aditamentos: [{ l: 'Aditamentos lançados', acao: () => { S.adEdit = null; render(); }, ativo: () => !S.adEdit }, { l: 'Novo aditamento', acao: () => novoAditamento(), editor: true, ativo: () => S.adEdit && !S.adEdit.id }],
  material: [{ l: 'Inventário', aba: 'inv' }, { l: 'Cautelas', aba: 'caut' }, { l: 'Importar planilha', aba: 'imp', editor: true }],
  arquivo: [{ l: 'Todos os documentos', filtro: ['docTipo', ''] }, ...TIPOS_DOC_MENU()],
  config: [{ l: 'Tipos de serviço', aba: 'tipos' }, { l: 'Feriados', aba: 'feriados' }, { l: 'Documentos (cabeçalho e assinatura)', aba: 'geral' }, { l: 'Usuários', aba: 'usuarios', admin: true }, { l: 'Backup', aba: 'backup' }]
};
function TIPOS_DOC_MENU() { return [['Aditamentos', 'Aditamentos'], ['Escalas', 'Escalas'], ['Missoes', 'Ordens de missão'], ['Cautelas', 'Termos de cautela'], ['Material', 'Relações de material']].map(([v, l]) => ({ l, filtro: ['docTipo', v] })); }
const subsDe = v => (SUBMENU[v] || []).filter(i => (!i.editor || pode()) && (!i.admin || admin()));
function subAtivo(v, i) {
  const lista = subsDe(v);
  if (i.ativo) return !!i.ativo();
  if (i.aba) return (S.sub[v] || lista.find(x => x.aba).aba) === i.aba;
  if (i.filtro) { const [f, val] = i.filtro; const pad0 = lista.find(x => x.filtro && x.filtro[0] === f).filtro[1]; return (S.filtro[f] ?? pad0) === val; }
  return false;
}
function irPara(v) { S.view = v; if (v !== 'aditamentos') S.adEdit = null; try { localStorage.setItem('cia-view', v); } catch (e) { } fecharMenu(); render(); window.scrollTo(0, 0); }
function irSub(v, idx) {
  const i = subsDe(v)[idx];
  if (i.aba) S.sub[v] = i.aba;
  if (i.filtro) S.filtro[i.filtro[0]] = i.filtro[1];
  irPara(v);
  if (i.acao) i.acao();
}
function alternarMenu(abrir) {
  S.menu = abrir ?? !S.menu;
  S.menuAberto = S.menu ? S.view : null; S.menuNivel2 = false;
  renderMenu();
}
function fecharMenu() { if (S.menu) alternarMenu(false); }
function hoverMenu(v) { if (S.menuAberto === v || matchMedia('(max-width: 760px)').matches) return; S.menuAberto = v; renderMenu(); }
function clicarMenu(v) {
  if (!subsDe(v).length) return irPara(v);
  if (matchMedia('(max-width: 760px)').matches) { S.menuAberto = v; S.menuNivel2 = true; return renderMenu(); }
  irPara(v);
}
function renderMenu() {
  const hamb = $('#hamb');
  hamb.innerHTML = S.menu ? ICO.fechar : ICO.menu;
  hamb.setAttribute('aria-expanded', S.menu ? 'true' : 'false');
  hamb.setAttribute('aria-label', S.menu ? 'Fechar menu' : 'Abrir menu');
  document.documentElement.style.setProperty('--hdr-h', $('#hdr').offsetHeight + 'px');
  if (!S.menu) { $('#menu').innerHTML = ''; return; }
  const aberto = S.menuAberto, subs = subsDe(aberto), nome = (VIEWS.find(x => x[0] === aberto) || [])[1];
  $('#menu').innerHTML = `<nav class="menu ${S.menuNivel2 ? 'nivel2' : ''}" aria-label="Menu principal" onclick="if(event.target===this)fecharMenu()">
    <div class="col c1">${VIEWS.map(([k, l]) => `<button class="it ${S.view === k ? 'on' : ''} ${aberto === k && S.view !== k ? 'aberto' : ''}" onmouseenter="hoverMenu('${k}')" onfocus="hoverMenu('${k}')" onclick="clicarMenu('${k}')">${esc(l)}${subsDe(k).length ? '<span class="chev">›</span>' : ''}</button>`).join('')}
      <div class="rodape"><div class="sigla">${ICO.escudo}${esc(sigla())}</div><div>${esc(S.user?.email || '')}</div></div></div>
    ${subs.length ? `<div class="col c2"><button class="it voltar" onclick="S.menuNivel2=false;renderMenu()">‹ Voltar</button>
      <button class="it ${S.view === aberto ? 'on' : ''}" onclick="irPara('${aberto}')" style="font-weight:700;color:var(--text)">${esc(nome)}</button>
      ${subs.map((i, n) => `<button class="it ${S.view === aberto && subAtivo(aberto, i) ? 'on' : ''}" onclick="irSub('${aberto}', ${n})">${esc(i.l)}</button>`).join('')}</div>` : ''}
    <div class="grow" onclick="fecharMenu()"></div></nav>`;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { fecharMenu(); fecharPops(); } });
window.addEventListener('resize', () => document.documentElement.style.setProperty('--hdr-h', $('#hdr').offsetHeight + 'px'));

// ---------- atalhos e usuário (pop-ups do cabeçalho)
function abrirPop(qual, ev) {
  ev.stopPropagation();
  const el = $('#pop-' + qual), estava = !el.hidden;
  fecharPops(); fecharMenu();
  if (estava) return;
  if (qual === 'atalhos') {
    const itens = pode() ? [['Nova missão', 'irPara(\'missoes\');editarMissao()'], ['Novo aditamento', 'irPara(\'aditamentos\');novoAditamento()'], ['Nova cautela de material', 'irPara(\'material\');novaCautela()'],
      ['Lançar afastamento', 'irPara(\'efetivo\');editarImp()'], ['Gerar escala do mês', 'irPara(\'escala\');gerarMes()'], ['Salvar PDF da escala do mês', 'imprimirEscala(undefined,true)']]
      : [['Serviço do mês', 'irPara(\'escala\')'], ['Missões', 'irPara(\'missoes\')'], ['Arquivo PDF', 'irPara(\'arquivo\')']];
    el.innerHTML = itens.map(([l, f]) => `<button onclick="fecharPops();${f}">${l}</button>`).join('');
  } else {
    el.innerHTML = `<div class="info"><b>${esc(S.user?.nome || '')}</b>${esc(S.user?.email || '')}<br>Perfil: ${esc(S.user?.perfil || '')}</div>
      ${admin() ? `<button onclick="fecharPops();S.sub.config='usuarios';irPara('config')">Gerenciar usuários</button>` : ''}
      <button onclick="fecharPops();S.sub.config='geral';irPara('config')">Configurações</button>
      ${!NO_GOOGLE ? `<button onclick="fecharPops();confirmar('Apagar os dados de demonstração?').then(s=>{if(s){Demo.resetar();iniciar()}})">Recomeçar demonstração</button>` : ''}`;
  }
  el.hidden = false;
}
function fecharPops() { $$('.pop').forEach(p => p.hidden = true); }
document.addEventListener('click', e => { if (!e.target.closest('.pop')) fecharPops(); });

// ---------- busca geral
function buscar(ev) { ev.preventDefault(); S.busca = $('#q').value.trim(); if (S.busca) irPara('busca'); }
function vBusca() {
  const q = norm(S.busca), tem = (...t) => t.some(x => norm(x).includes(q));
  const grupos = [
    ['Militares', S.db.Militares.filter(m => tem(nomeMil(m), m.nomeCompleto, m.idt, m.pelotao)).sort(ordemMil), m => esc(nomeMil(m)) + ` <span class="muted">${esc(m.nomeCompleto)}</span>`, m => `editarMil('${m.id}')`],
    ['Material', S.db.Material.filter(m => tem(m.patrimonio, m.descricao, m.localizacao)), m => `${esc(m.descricao)} <span class="muted">${esc(m.patrimonio)}</span>`, m => `editarMat('${m.id}')`],
    ['Missões', S.db.Missoes.filter(m => tem(m.titulo, m.local, m.descricao)), m => `${esc(m.titulo)} <span class="muted">${fmt(m.inicio)}</span>`, m => `editarMissao('${m.id}')`],
    ['Aditamentos', S.db.Aditamentos.filter(a => tem('aditamento ' + a.numero, a.parte1, a.parte2, a.parte3, a.parte4)), a => `Aditamento nº ${esc(a.numero)} <span class="muted">${fmt(a.data)}</span>`, a => `irPara('aditamentos');abrirAditamento('${a.id}')`],
    ['Arquivo PDF', S.db.Documentos.filter(d => tem(d.titulo)), d => esc(d.titulo), d => d.url ? `window.open('${esc(d.url)}','_blank')` : `irPara('arquivo')`]
  ].filter(g => g[1].length);
  const total = grupos.reduce((n, g) => n + g[1].length, 0);
  return `<h2>Resultados da busca</h2><p class="sub">${total} resultado(s) para “${esc(S.busca)}”.</p>` + (grupos.map(([t, l, txt, acao]) =>
    `<div class="res"><h3>${t} <span class="tag">${l.length}</span></h3><div class="tw"><table><tbody>${l.slice(0, 30).map(r => `<tr><td>${txt(r)}</td><td class="acts"><button class="btn sm" onclick="${acao(r)}">Abrir</button></td></tr>`).join('')}</tbody></table></div></div>`).join('') || '<div class="card">Nada encontrado. Tente o nome de guerra, o número de patrimônio ou parte do nome da missão.</div>');
}

// ---------- montagem da página
const sigla = () => cfg('sigla') || cfg('nomeCia') || 'Cia';
function render() {
  $('#sigla').innerHTML = ICO.escudo + esc(sigla());
  const linhas = cabecalhoDoc().filter(l => !/minist[eé]rio/i.test(l));
  $('#org').innerHTML = linhas.slice(0, 3).map(esc).join('<br>');
  $('#titulo').textContent = cfg('nomeCia') || 'Sistema da Companhia';
  const nome = S.view === 'busca' ? 'Busca' : (VIEWS.find(v => v[0] === S.view) || VIEWS[0])[1];
  const sub = subsDe(S.view).find(i => !i.acao && subAtivo(S.view, i)) || (S.view === 'aditamentos' && S.adEdit ? { l: 'Aditamento nº ' + S.adEdit.numero } : null);
  $('#crumb').innerHTML = `<nav class="crumb" aria-label="Você está aqui"><a onclick="irPara('painel')" title="Painel">${ICO.casa}</a>
    ${S.view !== 'painel' ? `<span class="sep">›</span>${sub ? `<a onclick="irPara('${S.view}')">${esc(nome)}</a><span class="sep">›</span><span>${esc(sub.l)}</span>` : `<span>${esc(nome)}</span>`}` : '<span class="sep">›</span><span>Painel</span>'}</nav>`;
  $('#app').innerHTML = (VIEWS_FN[S.view] || vPainel)();
  if (S.menu) renderMenu();
}

// ============================================================ painel
function vPainel() {
  const d = hoje(), amanha = addDias(d, 1);
  const mil = militaresAtivos();
  const sits = mil.map(m => situacao(m.id, d));
  const prontos = sits.filter(s => s.tipo === 'pronto').length;
  const emMissao = sits.filter(s => s.tipo === 'missao').length;
  const imped = mil.map(m => ({ m, s: situacao(m.id, d) })).filter(x => x.s.tipo === 'imp');
  const servico = dia => tiposAtivos().map(t => { const e = (ESC_DIA[dia] || []).find(e => e.tipoId === t.id); return `<li><span class="muted">${esc(t.nome)}</span><b>${e ? esc(nomeMil(e.militarId)) : '<span class="tag warn">vazio</span>'}</b></li>`; }).join('');
  const missoes = S.db.Missoes.filter(m => missaoAtiva(m) && m.inicio <= addDias(d, 7) && (m.fim || m.inicio) >= d).sort((a, b) => a.inicio.localeCompare(b.inicio));
  const abertas = S.db.Cautelas.filter(c => c.status !== 'Devolvida');
  const vencidas = abertas.filter(c => c.previsaoDevolucao && c.previsaoDevolucao < d);
  const manut = S.db.Material.filter(m => m.estado === 'Em manutenção' || m.estado === 'Inservível');
  return `<h2>Painel</h2><p class="sub">${esc(SEMANA[dataDe(d).getDay()])}, ${fmtExt(d)} · escala <span class="tag ${corDoDia(d) === 'V' ? 'vermelha' : 'preta'}">${corDoDia(d) === 'V' ? 'vermelha' : 'preta'}</span>${FERIADO[d] ? ' · ' + esc(FERIADO[d]) : ''}</p>
  <div class="cards">
    <div class="card"><h4>Efetivo</h4><div class="big">${prontos}<span class="muted" style="font-size:16px"> / ${mil.length} prontos</span></div><div class="muted">${imped.length} impedido(s) · ${emMissao} em missão</div></div>
    <div class="card"><h4>Missões (próx. 7 dias)</h4><div class="big">${missoes.length}</div><div class="muted">${S.db.Missoes.filter(m => m.status === 'Em andamento').length} em andamento</div></div>
    <div class="card"><h4>Cautelas abertas</h4><div class="big">${abertas.length}</div><div class="${vencidas.length ? 'tag dng' : 'muted'}">${vencidas.length} vencida(s)</div></div>
    <div class="card"><h4>Material</h4><div class="big">${S.db.Material.length}<span class="muted" style="font-size:16px"> itens</span></div><div class="muted">${manut.length} em manutenção/inservível</div></div>
  </div>
  <div class="cards">
    <div class="card"><h4>Serviço de hoje</h4><ul class="list">${servico(d) || '<li class="muted">Cadastre os tipos de serviço em Configurações.</li>'}</ul></div>
    <div class="card"><h4>Serviço de amanhã · ${fmt(amanha)}</h4><ul class="list">${servico(amanha)}</ul></div>
    <div class="card"><h4>Impedidos hoje</h4><ul class="list">${imped.map(x => `<li><span>${esc(nomeMil(x.m))}</span>${tagSituacao(x.s)}</li>`).join('') || '<li class="muted">Ninguém impedido.</li>'}</ul></div>
    <div class="card"><h4>Missões</h4><ul class="list">${missoes.map(m => `<li><span>${esc(m.titulo)}</span><span class="muted">${fmt(m.inicio)}</span></li>`).join('') || '<li class="muted">Nenhuma nos próximos 7 dias.</li>'}</ul></div>
  </div>
  ${vencidas.length ? `<h3>Cautelas vencidas</h3>${tabelaCautelas(vencidas)}` : ''}`;
}

  { k: 'postoGrad', l: 'Posto/Graduação', t: 'select', o: POSTOS, req: true },
  { k: 'numero', l: 'Número' },
  { k: 'nomeGuerra', l: 'Nome de guerra', req: true },
  { k: 'nomeCompleto', l: 'Nome completo' },
  { k: 'antiguidade', l: 'Antiguidade (1 = mais antigo)', t: 'number' },
  { k: 'idt', l: 'Identidade' },
  { k: 'pelotao', l: 'Pelotão/Seção' },
  { k: 'funcao', l: 'Função' },
  { k: 'telefone', l: 'Telefone' },
  { k: 'ativo', l: 'Ativo', t: 'select', o: ['Sim', 'Não'], padrao: 'Sim', vazio: false },
  { k: 'obs', l: 'Observações', full: true }
];
const CAMPOS_IMP = [
  { k: 'militarId', l: 'Militar', t: 'militar', req: true },
  { k: 'tipo', l: 'Tipo', t: 'select', o: TIPOS_IMPED, req: true },

  { k: 'obs', l: 'Observações', full: true }
];
function vEfetivo() {
  const t = aba('efetivo', 'mil'), d = hoje();
  let corpo = '';
  if (t === 'mil') {
    const lista = S.db.Militares.slice().sort(ordemMil).filter(m => casa('mil', nomeMil(m), m.nomeCompleto, m.pelotao, m.funcao));
    corpo = `<div class="bar">${busca('mil', 'Buscar militar…')}<span class="grow"></span>${pode() ? '<button class="btn pri" onclick="editarMil()">+ Militar</button>' : ''}</div>
    ${tabela(lista, [
      { l: 'Militar', v: m => `<b>${esc(nomeMil(m))}</b><div class="muted">${esc(m.nomeCompleto)}</div>` },
      { l: 'Pel/Seç', v: m => esc(m.pelotao) }, { l: 'Função', v: m => esc(m.funcao) },
      { l: 'Situação hoje', v: m => sim(m.ativo) ? tagSituacao(situacao(m.id, d)) : '<span class="tag">Inativo</span>' },
      { l: 'Telefone', v: m => esc(m.telefone) }
    ], pode() ? m => `<button class="btn sm" onclick="editarMil('${m.id}')">Editar</button> <button class="btn sm" onclick="editarImp(null,'${m.id}')">Afastar</button>` : null)}
    <p class="muted">${lista.length} militar(es).</p>`;
  } else if (t === 'imp') {
    const lista = S.db.Impedimentos.slice().sort((a, b) => b.inicio.localeCompare(a.inicio)).filter(i => casa('imp', nomeMil(i.militarId), i.tipo));
    corpo = `<div class="bar">${busca('imp', 'Buscar…')}<span class="grow"></span>${pode() ? '<button class="btn pri" onclick="editarImp()">+ Afastamento</button>' : ''}</div>
    ${tabela(lista, [
      { l: 'Militar', v: i => esc(nomeMil(i.militarId)) }, { l: 'Tipo', v: i => esc(i.tipo) },
      { l: 'Período', v: i => `${fmt(i.inicio)} a ${fmt(i.fim)}` },
      { l: 'Situação', v: i => i.fim < d ? '<span class="tag">Encerrado</span>' : i.inicio > d ? '<span class="tag info">Previsto</span>' : '<span class="tag warn">Em curso</span>' },
      { l: 'Obs', v: i => esc(i.obs) }
    ], pode() ? i => `<button class="btn sm" onclick="editarImp('${i.id}')">Editar</button> <button class="btn sm dng" onclick="excluir('Impedimentos','${i.id}')">Excluir</button>` : null)}`;
  } else {
    corpo = vImportar('Militares');
  }
  return `<h2>Efetivo</h2><p class="sub">Militares da subunidade, férias, dispensas e demais afastamentos.</p>
  ${abas('efetivo', [['mil', 'Militares'], ['imp', 'Afastamentos'], ...(pode() ? [['imp-x', 'Importar planilha']] : [])])}${corpo}`;
}
function editarMil(id) {
  const m = id ? MIL[id] : {};
  abrirForm({ titulo: id ? 'Editar militar' : 'Novo militar', campos: CAMPOS_MIL, valores: m, aoSalvar: o => salvar('Militares', [o]),
    extra: id ? `<div class="acts" style="justify-content:flex-start"><button type="button" class="btn sm dng" onclick="excluir('Militares','${id}',true)">Excluir militar</button></div>` : '' });
}
function editarImp(id, militarId) {
  abrirForm({ titulo: id ? 'Editar afastamento' : 'Novo afastamento', campos: CAMPOS_IMP, valores: id ? S.db.Impedimentos.find(i => i.id === id) : { militarId, inicio: hoje() },
    aoSalvar: o => { if (o.fim < o.inicio) throw new Error('O fim não pode ser antes do início.'); return salvar('Impedimentos', [o]); } });
}
async function excluir(tabela, id, modal) {
  if (!await confirmar('Excluir este registro? Esta ação não pode ser desfeita.')) return;
  await salvar(tabela, [], [id]);
  if (modal) fecharModal();
  toast('Excluído.'); render();
}

// ============================================================ escala
function diasDoMes(ym) { const [y, m] = ym.split('-').map(Number); const n = new Date(y, m, 0).getDate(); return Array.from({ length: n }, (_, i) => `${ym}-${pad(i + 1)}`); }

function vEscala() {
  const t = aba('escala', 'mes');
  const tipos = tiposAtivos();
  const dias = diasDoMes(S.mes);
  const titulo = `<h2>Escala de serviço</h2><p class="sub">Escala <b>preta</b> (dias úteis) e <b>vermelha</b> (sábados, domingos e feriados), com controle automático de folga.</p>`;
  if (!tipos.length) return titulo + '<div class="card">Cadastre os tipos de serviço em <a href="#" onclick="irPara(\'config\')">Configurações</a>.</div>';
  const barra = `<div class="bar"><input type="month" value="${S.mes}" onchange="S.mes=this.value;render()">
    <button class="btn" onclick="mudarMes(-1)">◀</button><button class="btn" onclick="mudarMes(1)">▶</button><span class="grow"></span>
    ${pode() ? `<button class="btn pri" onclick="gerarMes()">Gerar dias vazios</button><button class="btn" onclick="refazerDesde()">Refazer a partir de…</button>` : ''}
    <button class="btn" onclick="imprimirEscala()">Imprimir</button>${pode() ? '<button class="btn" onclick="imprimirEscala(undefined,true)">Salvar PDF</button>' : ''}</div>`;
  if (t === 'folgas') return titulo + abas('escala', [['mes', 'Escala do mês'], ['folgas', 'Quadro de folgas']]) + barra + vFolgas(dias[0]);
  const linhas = dias.map(d => {
    const cor = corDoDia(d), w = dataDe(d).getDay();
    return `<tr class="${cor === 'V' ? 'v' : ''} ${d === hoje() ? 'hoje' : ''}"><td class="dia">${d.slice(8)} ${SEM_CURTA[w]}${FERIADO[d] ? ` <span title="${esc(FERIADO[d])}">★</span>` : ''}</td>
    ${tipos.map(tp => {
      const e = (ESC_DIA[d] || []).find(x => x.tipoId === tp.id);
      const al = e ? alertasEscala(e) : [];
      const aviso = al.length ? ` <span class="alerta" title="${esc(al.join('; '))}">⚠</span>` : '';
      if (!pode()) return `<td>${e ? esc(nomeMil(e.militarId)) : '<span class="muted">—</span>'}${aviso}</td>`;
      const ops = militaresAtivos().filter(m => aptoPara(m, tp) || (e && e.militarId === m.id))
        .map(m => { const s = situacao(m.id, d); return `<option value="${m.id}" ${e && e.militarId === m.id ? 'selected' : ''}>${esc(nomeMil(m))}${s.tipo !== 'pronto' ? ' (' + esc(s.texto) + ')' : ''}</option>`; }).join('');
      return `<td><select onchange="trocarServico('${d}','${tp.id}',this.value)"><option value="">—</option>${ops}</select>${aviso}</td>`;
    }).join('')}</tr>`;
  }).join('');
  const vazios = dias.reduce((n, d) => n + tipos.filter(tp => !(ESC_DIA[d] || []).some(e => e.tipoId === tp.id)).length, 0);
  return titulo + abas('escala', [['mes', 'Escala do mês'], ['folgas', 'Quadro de folgas']]) + barra +
    `<div class="tw escala"><table><thead><tr><th>Dia</th>${tipos.map(tp => `<th>${esc(tp.nome)}</th>`).join('')}</tr></thead><tbody>${linhas}</tbody></table></div>
    <p class="muted">${vazios} serviço(s) sem militar neste mês. ⚠ = conflito (impedimento, missão ou dias seguidos). ★ = feriado.</p>`;
}
function mudarMes(n) { const [y, m] = S.mes.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); S.mes = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); }

async function trocarServico(data, tipoId, militarId) {
  const e = (ESC_DIA[data] || []).find(x => x.tipoId === tipoId);
  try {
    if (!militarId) { if (e) await salvar('Escala', [], [e.id]); }
    else await salvar('Escala', [{ ...(e || { id: uid(), data, tipoId, obs: '' }), militarId, cor: corDoDia(data) }]);
    toast('Escala atualizada.'); render();
  } catch (err) { render(); }
}
async function gerarMes() {
  const dias = diasDoMes(S.mes);
  const { novos, faltas } = gerarEscala(dias[0], dias[dias.length - 1], S.db.Escala);
  if (!novos.length) return toast(faltas.length ? 'Sem militares disponíveis para: ' + faltas.slice(0, 3).join(', ') : 'O mês já está completo.', !!faltas.length);
  await salvar('Escala', novos);
  toast(`${novos.length} serviço(s) gerado(s).` + (faltas.length ? ` ${faltas.length} sem militar disponível.` : ''));
  render();
}
async function refazerDesde() {
  const dias = diasDoMes(S.mes);
  const sugestao = hoje() > dias[0] && hoje() <= dias[dias.length - 1] ? addDias(hoje(), 1) : dias[0];
  const inicio = await dialogo({ msg: 'Apagar e gerar novamente a escala a partir de qual data até o fim do mês? Trocas manuais nesse período serão perdidas.', campo: 'date', valor: sugestao, ok: 'Refazer escala' });
  if (!inicio) return;
  const fim = dias[dias.length - 1];
  if (inicio < dias[0] || inicio > fim) return toast('Escolha uma data dentro do mês exibido.', true);
  const remover = S.db.Escala.filter(e => e.data >= inicio && e.data <= fim);
  const { novos } = gerarEscala(inicio, fim, S.db.Escala.filter(e => !(e.data >= inicio && e.data <= fim)));
  await salvar('Escala', novos, remover.map(e => e.id));
  toast(`Escala refeita de ${fmt(inicio)} a ${fmt(fim)}.`); render();
}

    tiposAtivos().map(tp => {

        const mes = S.db.Escala.filter(e => e.militarId === m.id && e.tipoId === tp.id && e.data.slice(0, 7) === S.mes).length;
        return { m, p, v, mes };

  const d = hoje(), ano = d.slice(0, 4);

function textoParte1(dia) {
  const cor = corDoDia(dia);
  const linhas = tiposAtivos().map(t => { const e = (ESC_DIA[dia] || []).find(x => x.tipoId === t.id); return `${t.nome}: ${e ? nomeMil(e.militarId) : '(não escalado)'}`; });
  return `SERVIÇOS DIÁRIOS PARA ${fmtMil(dia)} (${SEMANA[dataDe(dia).getDay()]}) – ESCALA ${cor === 'V' ? 'VERMELHA' : 'PRETA'}${FERIADO[dia] ? ' – ' + FERIADO[dia].toUpperCase() : ''}\n` + linhas.join('\n');
}
function textoParte3(de, ate) {
  const blocos = [];
  const imps = S.db.Impedimentos.filter(i => i.inicio >= de && i.inicio <= ate).sort((a, b) => a.tipo.localeCompare(b.tipo));
  if (imps.length) {
    const porTipo = {};
    imps.forEach(i => (porTipo[i.tipo] ||= []).push(i));
    blocos.push('1. AFASTAMENTOS\n' + Object.entries(porTipo).map(([tipo, l], k) =>
      `${'abcdefghij'[k]}. ${tipo}\n` + l.map(i => `- ${nomeMil(i.militarId)}: de ${fmtMil(i.inicio)} a ${fmtMil(i.fim)}${i.obs ? ' (' + i.obs + ')' : ''}.`).join('\n')).join('\n'));
  }
  const retornos = S.db.Impedimentos.filter(i => i.fim && addDias(i.fim, 1) >= de && addDias(i.fim, 1) <= ate);
  if (retornos.length) blocos.push(`${blocos.length + 1}. APRESENTAÇÃO / RETORNO\n` + retornos.map(i => `- ${nomeMil(i.militarId)}, por término de ${i.tipo.toLowerCase()}, em ${fmtMil(addDias(i.fim, 1))}.`).join('\n'));
  const mis = S.db.Missoes.filter(m => m.status !== 'Cancelada' && m.inicio >= de && m.inicio <= ate);
  if (mis.length) blocos.push(`${blocos.length + 1}. MISSÕES\n` + mis.map((m, k) => {
    const pessoal = ids(m.militaresIds).map(i => MIL[i]).filter(Boolean).sort(ordemMil).map(nomeMil);
    return `${'abcdefghij'[k]}. ${m.titulo}\nDesigno os militares abaixo para a missão em epígrafe, ${m.local ? 'em ' + m.local + ', ' : ''}no período de ${fmtMil(m.inicio)}${m.fim && m.fim !== m.inicio ? ' a ' + fmtMil(m.fim) : ''}${m.responsavelId ? ', sob o comando do ' + nomeMil(m.responsavelId) : ''}:\n${pessoal.map(p => '- ' + p).join('\n') || '- (pessoal a definir)'}`;
  }).join('\n'));
  const caut = S.db.Cautelas.filter(c => c.dataSaida >= de && c.dataSaida <= ate);
  if (caut.length) blocos.push(`${blocos.length + 1}. MATERIAL – CAUTELAS\n` + caut.map(c => { const m = MAT[c.materialId] || {}; return `- ${c.quantidade} ${m.unidade || 'un'} de ${m.descricao || '?'}${m.patrimonio ? ' (patr. ' + m.patrimonio + ')' : ''} ao ${nomeMil(c.militarId)}.`; }).join('\n'));
  return blocos.join('\n\n') || 'Sem alteração.';
}

async function preencherParte(n) {
  const a = S.adEdit;
  const atual = a['parte' + n];
  if (atual && atual !== 'Sem alteração.' && !await confirmar('Substituir o texto atual desta parte?')) return;
  a['parte' + n] = n === 1 ? textoParte1(a.dataServico) : textoParte3(a.data, a.dataServico);
  render();
}
async function salvarAditamento(status) {
  const a = S.adEdit;
  if (!a.numero || !a.data) return toast('Informe número e data.', true);
  if (status) a.status = status;
  const [salvo] = await salvar('Aditamentos', [a]);
  S.adEdit = { ...a, id: salvo.id };
  toast('Aditamento salvo.'); render();
  return S.adEdit;
}
async function excluirAditamento() { if (!await confirmar('Excluir este aditamento?')) return; await salvar('Aditamentos', [], [S.adEdit.id]); S.adEdit = null; render(); }

/** Estrutura do documento: usada tanto na impressão quanto no Google Doc. */
function paragrafosAditamento(a) {
  const P = [];
  cabecalhoDoc().forEach(l => P.push({ texto: l, centro: true, negrito: true }));
  P.push({ texto: '' });
  P.push({ texto: `ADITAMENTO Nº ${a.numero} AO BOLETIM INTERNO Nº ${a.biNumero || '___'}`, centro: true, negrito: true });
  P.push({ texto: `${cfg('cidade')}, ${fmtExt(a.data)}.`, centro: true });
  P.push({ texto: '' });
  P.push({ texto: 'Para conhecimento desta Subunidade e devida execução, publico o seguinte:' });
  PARTES.forEach((t, i) => {
    P.push({ texto: '' }); P.push({ texto: t, centro: true, negrito: true });
    String(a['parte' + (i + 1)] || 'Sem alteração.').split('\n').forEach(l => P.push({ texto: l }));
  });
  P.push({ texto: '' }); P.push({ texto: '' });
  P.push({ texto: cfg('cmtNome'), centro: true, negrito: true });
  P.push({ texto: cfg('cmtFuncao'), centro: true });
  return P;
}
function imprimirAditamento(id, pdf) {
  const a = id ? S.db.Aditamentos.find(x => x.id === id) : S.adEdit;
  return imprimir(paragrafosAditamento(a).map(p => `<p class="${p.centro ? 'c' : ''} ${p.negrito ? 'b' : ''}">${esc(p.texto) || '&nbsp;'}</p>`).join(''),
    { tipo: 'Aditamentos', titulo: `Aditamento ${String(a.numero).padStart(3, '0')} - ${a.data}`, ref: a.id }, pdf);
}
async function publicarAditamento() {
  const a = await salvarAditamento('Publicado');
  if (a) await imprimirAditamento(a.id, true);
}
async function gerarDocAditamento() {
  try {
    const a = await salvarAditamento();
    toast('Gerando Google Doc…');
    const url = await api('criarDocAditamento', a.id, `Aditamento ${a.numero} - ${fmt(a.data)}`, paragrafosAditamento(a));
    S.adEdit.docUrl = url;
    const reg = S.db.Aditamentos.find(x => x.id === a.id); if (reg) reg.docUrl = url;
    toast('Google Doc criado.'); render();
    window.open(url, '_blank');
  } catch (e) { toast(e.message, true); }
}

const IMPORT = {
  Material: { chaves: ['patrimonio', 'descricao'], campos: CAMPOS_MAT.filter(c => c.t !== 'file'),
    sin: { patrimonio: ['patrimonio', 'nrpatrimonio', 'numeropatrimonio', 'serie', 'nserie', 'numero', 'registro'], descricao: ['descricao', 'material', 'item', 'nomenclatura', 'especificacao', 'nome'], quantidade: ['quantidade', 'qtd', 'qtde', 'quant', 'existencia'], unidade: ['unidade', 'un', 'und', 'unid'], localizacao: ['local', 'localizacao', 'deposito', 'reserva', 'setor'], estado: ['estado', 'situacao', 'condicao'], valor: ['valor', 'valorunitario', 'preco', 'vlunit'], categoria: ['categoria', 'classe', 'tipo', 'grupo'] } },
  Militares: { chaves: ['idt', 'nomeGuerra'], campos: CAMPOS_MIL,
    sin: { postoGrad: ['posto', 'postograd', 'pg', 'graduacao', 'postograduacao'], nomeGuerra: ['nomedeguerra', 'nomeguerra', 'guerra'], nomeCompleto: ['nomecompleto', 'nome'], idt: ['idt', 'identidade', 'idtmil'], numero: ['numero', 'nr', 'num'], pelotao: ['pelotao', 'pel', 'secao', 'fracao'], telefone: ['telefone', 'celular', 'fone', 'tel'], funcao: ['funcao', 'cargo'], antiguidade: ['antiguidade', 'ant'] } }
};
function vImportar(tabelaAlvo) {
  const st = S.imp && S.imp.tabela === tabelaAlvo ? S.imp : null;
  const cfgI = IMPORT[tabelaAlvo];
  let html = `<div class="card"><p>Traga sua planilha atual (do computador ou do Google Drive). Na próxima etapa você confere qual coluna vai para qual campo. Registros com o mesmo <b>${cfgI.chaves.join(' / ')}</b> são atualizados em vez de duplicados.</p>
    <div class="bar"><input type="file" accept=".xlsx,.xls,.csv,.ods" onchange="importarArquivo(this.files[0],'${tabelaAlvo}')">

    <button class="btn" onclick="importarGoogle('${tabelaAlvo}')">Ler do Drive</button></div></div>`;
  if (st) {

    html += `<h3>Associação de colunas — ${corpo.length} linha(s) em "${esc(st.origem)}"</h3><div class="card"><div class="form">
      ${cfgI.campos.map(c => `<label>${esc(c.l)}<select id="map_${c.k}"><option value="">(não importar)</option>${cab.map((h, i) => `<option value="${i}" ${st.mapa[c.k] === i ? 'selected' : ''}>${esc(h || 'Coluna ' + (i + 1))}</option>`).join('')}</select></label>`).join('')}
      </div><div class="bar" style="margin-top:12px"><span class="grow"></span><button class="btn" onclick="S.imp=null;render()">Cancelar</button><button class="btn pri" onclick="confirmarImportacao()">Importar ${corpo.length} linha(s)</button></div></div>
      <h3>Prévia</h3>${tabela(corpo.slice(0, 5), cab.map((h, i) => ({ l: h || 'Coluna ' + (i + 1), v: l => esc(l[i]) })))}`;
  }
  return html;
}
function prepararImportacao(tabelaAlvo, linhas, origem) {
  // Procura a linha de cabeçalho entre as 10 primeiras (planilhas costumam ter título acima).
  const sin = IMPORT[tabelaAlvo].sin;
  let melhor = 0, pts = -1;
  linhas.slice(0, 10).forEach((l, i) => { const p = l.filter(h => Object.values(sin).some(s => s.includes(norm(h)))).length; if (p > pts) { pts = p; melhor = i; } });
  linhas = linhas.slice(melhor).map(l => l.map(v => v == null ? '' : String(v)));
  const cab = linhas[0].map(norm), mapa = {};
  IMPORT[tabelaAlvo].campos.forEach(c => {
    const opcoes = [norm(c.k), norm(c.l), ...(sin[c.k] || [])];
    const i = cab.findIndex(h => h && opcoes.includes(h));
    if (i >= 0 && !Object.values(mapa).includes(i)) mapa[c.k] = i;
  });
  S.imp = { tabela: tabelaAlvo, linhas, mapa, origem };
  render();
}
function carregarSheetJS() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, falha) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = () => falha(new Error('Não foi possível carregar o leitor de planilhas.')); document.head.appendChild(s); });
}
async function importarArquivo(file, tabelaAlvo) {
  if (!file) return;
  try {
    await carregarSheetJS();
    // CSV vai como texto UTF-8; lido como binário, os acentos do cabeçalho se perdem.
    const wb = /\.csv$/i.test(file.name)
      ? XLSX.read(await file.text(), { type: 'string', cellDates: true })
      : XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const sh = wb.Sheets[wb.SheetNames[0]];
    const linhas = XLSX.utils.sheet_to_json(sh, { header: 1, raw: false, defval: '', dateNF: 'yyyy-mm-dd' });
    prepararImportacao(tabelaAlvo, linhas, file.name);
  } catch (e) { toast('Erro ao ler arquivo: ' + e.message, true); }
}
async function importarGoogle(tabelaAlvo) {
  const url = $('#imp_url').value.trim();
  if (!url) return toast('Cole o link da planilha.', true);
  try { toast('Lendo planilha…'); prepararImportacao(tabelaAlvo, await api('importarDePlanilha', url), 'Google Drive'); }
  catch (e) { toast(e.message, true); }
}
function dataImportada(v) {
  v = String(v).trim();
  let m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(m[2])}-${pad(m[1])}`;
  m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[0] : v;
}
async function confirmarImportacao() {
  const st = S.imp, cfgI = IMPORT[st.tabela];
  const mapa = {};
  cfgI.campos.forEach(c => { const v = $('#map_' + c.k).value; if (v !== '') mapa[c.k] = +v; });
  const obrig = cfgI.campos.filter(c => c.req).map(c => c.k).filter(k => !(k in mapa));
  if (obrig.length) return toast('Associe os campos obrigatórios: ' + obrig.join(', '), true);
  const existentes = S.db[st.tabela];
  const registros = st.linhas.slice(1).filter(l => l.some(v => String(v).trim())).map(l => {
    const o = {};
    Object.entries(mapa).forEach(([k, i]) => { let v = String(l[i] ?? '').trim(); const c = cfgI.campos.find(x => x.k === k); if (c.t === 'date') v = dataImportada(v); if (c.t === 'number') v = v ? String(num(v.replace(/\.(?=\d{3}(\D|$))/g, ''))) : v; o[k] = v; });
    if (st.tabela === 'Militares') { const p = POSTOS.find(p => norm(p) === norm(o.postoGrad)); if (p) o.postoGrad = p; o.ativo = o.ativo || 'Sim'; }
    if (st.tabela === 'Material') { o.quantidade = o.quantidade || '1'; o.unidade = o.unidade || 'un'; }
    const chave = cfgI.chaves.find(k => o[k]);
    const igual = chave && existentes.find(r => norm(r[chave]) === norm(o[chave]));
    return igual ? { ...igual, ...o } : o;
  }).filter(o => cfgI.campos.filter(c => c.req).every(c => o[c.k]));
  if (!registros.length) return toast('Nenhuma linha válida para importar.', true);
  if (!await confirmar(`Importar ${registros.length} registro(s) para ${st.tabela}?`)) return;
  await salvar(st.tabela, registros);
  S.imp = null; toast(`${registros.length} registro(s) importado(s).`); render();
}

async function feriadosNacionais() {
  const y = +S.mes.slice(0, 4);
  // Páscoa (algoritmo de Meeus) para os feriados móveis.
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
    h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  const pascoa = `${y}-${pad(mes)}-${pad(dia)}`;
  const lista = [[`${y}-01-01`, 'Confraternização Universal'], [addDias(pascoa, -48), 'Carnaval'], [addDias(pascoa, -47), 'Carnaval'], [addDias(pascoa, -2), 'Sexta-feira Santa'],
    [`${y}-04-21`, 'Tiradentes'], [`${y}-05-01`, 'Dia do Trabalho'], [addDias(pascoa, 60), 'Corpus Christi'], [`${y}-09-07`, 'Independência do Brasil'],
    [`${y}-10-12`, 'Nossa Senhora Aparecida'], [`${y}-11-02`, 'Finados'], [`${y}-11-15`, 'Proclamação da República'], [`${y}-11-20`, 'Dia da Consciência Negra'], [`${y}-12-25`, 'Natal']]
    .filter(([dt]) => !FERIADO[dt]).map(([data, descricao]) => ({ data, descricao }));
  if (!lista.length) return toast('Os feriados nacionais de ' + y + ' já estão cadastrados.');
  await salvar('Feriados', lista); toast(`${lista.length} feriado(s) de ${y} incluído(s).`); render();
}

function baixarBackup() {
  const blob = new Blob([JSON.stringify(S.db, null, 1)], { type: 'application/json' });

const TIPOS_DOC = TIPOS_DOC_MENU().map(i => [i.filtro[1], i.l]);
function vArquivo() {
  const tp = S.filtro.docTipo || '';

  <span class="grow"></span>${pasta ? `<a class="btn" href="https://drive.google.com/drive/folders/${esc(pasta)}" target="_blank">Abrir pasta no Drive</a>` : ''}</div>
  ${tabela(lista, [
    { l: 'Gerado em', v: d => `${fmt(d.data.slice(0, 10))} <span class="muted">${esc(d.data.slice(11))}</span>` },
    { l: 'Tipo', v: d => `<span class="tag">${esc((TIPOS_DOC.find(t => t[0] === d.tipo) || [0, d.tipo])[1])}</span>` },

  ], d => d.url ? `<a class="btn sm" href="${esc(d.url)}" target="_blank">Abrir PDF</a>` : '<span class="muted">só na versão instalada</span>')}
  <p class="muted">Para gerar: use "Salvar PDF" na escala, nas missões, nos aditamentos e no material. "Publicar e arquivar PDF" no aditamento faz isso automaticamente.</p>`;
}

// ============================================================ início
async function iniciar() {
  $$('[data-ico]').forEach(el => { el.outerHTML = ICO[el.dataset.ico]; });
  renderMenu();
  $('#demo-bar').hidden = !!NO_GOOGLE;
  try { S.view = localStorage.getItem('cia-view') || 'painel'; } catch (e) { }
  try {
    const r = await api('bootstrap');
    S.user = r.usuario;
    S.db = Object.fromEntries(TABS.map(t => [t, r.dados[t] || []]));
    indexar();
    $('#user').textContent = (S.user.nome || S.user.email || 'Usuário').split(' ')[0];
    render();
  } catch (e) {
    $('#app').innerHTML = `<div class="card" style="max-width:640px"><h3>Não foi possível abrir o sistema</h3><p>${esc(e.message)}</p></div>`;
  }
}
iniciar();
