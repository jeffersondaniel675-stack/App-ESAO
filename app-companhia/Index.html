<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema da Companhia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap">
<script>
  // Se o script principal falhar (por exemplo, arquivo colado incompleto no Apps Script), mostra o erro em vez de ficar em "Carregando…".
  window.__erros = [];
  window.addEventListener('error', function (e) {
    var msg = (e.message || 'erro desconhecido') + (e.lineno ? ' (linha ' + e.lineno + ', coluna ' + e.colno + ')' : '');
    try {
      // O Apps Script reprocessa o código antes de rodar. Para achar a linha exata, testa o script principal
      // como o Google o entregou, em pedaços cada vez menores, até achar a primeira linha inválida.
      var scripts = document.getElementsByTagName('script'), principal = '';
      for (var i = 0; i < scripts.length; i++) if (scripts[i].text.length > principal.length) principal = scripts[i].text;
      var L = principal.split('\n');
      var quebra = function (k) { try { new Function(L.slice(0, k).join('\n')); return ''; } catch (x) { return /end of input|Unterminated template/i.test(x.message) ? '' : x.message; } };
      var visivel = function (l) { return l.replace(/[^\x20-\x7e]/g, function (c) { var h = c.charCodeAt(0); return h === 9 ? ' ' : '[U+' + ('0000' + h.toString(16).toUpperCase()).slice(-4) + ']'; }); };
      var erroTotal = quebra(L.length);
      if (erroTotal) {
        var lo = 1, hi = L.length;
        while (lo < hi) { var meio = (lo + hi) >> 1; if (quebra(meio)) hi = meio; else lo = meio + 1; }
        msg += '\n\nPrimeira linha inválida no código entregue pelo Google (linha ' + lo + ' do script): ' + erroTotal;
        for (var d = -3; d <= 1; d++) { var t = L[lo - 1 + d]; if (t !== undefined) msg += '\n' + (d === 0 ? '>> ' : '   ') + visivel(t).slice(0, 220); }
      } else msg += '\n\n(O script principal, testado sozinho, não tem erro de sintaxe.)';
    } catch (x) { msg += '\n(diagnóstico indisponível: ' + x.message + ')'; }
    window.__erros.push(msg);
    var mostrar = function () {
      var app = document.getElementById('app'); if (!app) return;
      var fim = /end of input|Unexpected end|missing \}|unterminated/i.test(window.__erros.join(' '));
      app.innerHTML = '<div style="max-width:680px;margin:24px auto;padding:16px 20px;border:2px solid #e52207;border-radius:8px;background:#fff;color:#333;font:15px/1.5 sans-serif">'
        + '<b style="color:#e52207">O sistema encontrou um erro ao carregar.</b>'
        + '<pre style="white-space:pre-wrap;background:#f3f3f3;padding:8px;border-radius:4px">' + window.__erros.join('\n').replace(/</g, '&' + 'lt;') + '</pre>'
        + (fim ? '<p><b>O arquivo Index foi colado incompleto no Apps Script.</b> Abra o arquivo Index no editor, apague tudo, cole de novo o Index.html inteiro (a última linha tem que ser ' + '&' + 'lt;/html&' + 'gt;' + '), salve e publique uma nova versão.</p>'
               : '<p>Mande um print desta mensagem para quem instalou o sistema.</p>') + '</div>';
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mostrar); else mostrar();
  });
  // Script colado pela metade não roda e não gera erro: se o script principal não começou, avisa que o arquivo está incompleto.
  window.addEventListener('load', function () {
    if (window.__scriptOk || window.__erros.length) return;
    var app = document.getElementById('app');
    if (app) app.innerHTML = '<div style="max-width:680px;margin:24px auto;padding:16px 20px;border:2px solid #e52207;border-radius:8px;background:#fff;color:#333;font:15px/1.5 sans-serif">'
      + '<b style="color:#e52207">O arquivo Index está incompleto no Apps Script.</b>'
      + '<p>A colagem parou no meio do arquivo. No editor do Apps Script, abra o arquivo <b>Index</b>, apague tudo (Ctrl+A, Delete), cole de novo o <b>Index.html</b> inteiro e confira que a <b>última linha é ' + '&' + 'lt;/html&' + 'gt;' + '</b>. Salve (Ctrl+S) e publique uma nova versão (Implantar → Gerenciar implantações → editar → Nova versão).</p></div>';
  });
  // Aviso se o carregamento demorar demais (sem erro aparente).
  setTimeout(function () {
    var app = document.getElementById('app');
    if (app && /Carregando dados da planilha/.test(app.textContent) && !window.__erros.length) app.insertAdjacentHTML('beforeend',
      '<p style="max-width:640px;margin:16px auto;color:#636363;font:14px sans-serif;text-align:center">Está demorando mais que o normal. Confira se o arquivo <b>Index</b> foi colado inteiro no Apps Script (a última linha é ' + '&' + 'lt;/html&' + 'gt;' + ') e se a função <b>setup</b> foi executada. No computador, aperte F12 → aba Console e mande um print das mensagens em vermelho.</p>');
  }, 20000);
  // Tema escolhido neste aparelho: claro (padrão) ou preto.
  try { document.documentElement.dataset.theme = localStorage.getItem('cia-tema') === 'dark' ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
:root {
  /* Padrão Digital de Governo (gov.br DS): azul institucional, cinzas neutros, faixa amarela; tipografia Raleway (base da Rawline). */
  --azul: #1351b4; --azul-escuro: #0c326f; --marinho: #071d41; --azul-claro: #dbe8fb; --ouro: #ffcd07; --foco: #c2850c;
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f8f8f8; --cinza-5: #ededed; --border: #cccccc; --campo: #888888;
  --text: #333333; --muted: #636363; --on-azul: #ffffff;
  --menu-1: #ededed; --menu-2: #f8f8f8; --menu-fundo: rgba(237, 237, 237, .94); --menu-on: #071d41; --menu-on-fg: #ffffff; --menu-hover: #1351b4;
  --danger: #e52207; --warn: #8a6100; --ok: #168821; --info: #155bcb;
  --preta: #333333; --vermelha: #e52207;
  --shadow: 0 1px 6px rgba(51, 51, 51, .16);
  --fonte: "Raleway", "Rawline", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
/* Tema claro (branco) é o padrão. O tema preto vale quando o usuário escolhe (data-theme="dark")
   ou, no modo "seguir o aparelho" (sem data-theme), quando o aparelho está escuro. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
      --azul: #6ea8fe; --azul-escuro: #9ec5fe; --marinho: #f2f2f2; --azul-claro: #16233a; --ouro: #ffcd07; --foco: #ffcd07;
      --bg: #000000; --surface: #0d0d0d; --surface-2: #161616; --cinza-5: #1f1f1f; --border: #2f2f2f; --campo: #5c5c5c;
      --text: #ededed; --muted: #a6a6a6; --on-azul: #000000;
      --menu-1: #111111; --menu-2: #181818; --menu-fundo: rgba(0, 0, 0, .86); --menu-on: #f2f2f2; --menu-on-fg: #000000; --menu-hover: #2f6fd6;
      --danger: #ff7a66; --warn: #ffcd07; --ok: #4dc966; --info: #9ec5fe;
      --preta: #ededed; --vermelha: #ff7a66; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --azul: #6ea8fe; --azul-escuro: #9ec5fe; --marinho: #f2f2f2; --azul-claro: #16233a; --ouro: #ffcd07; --foco: #ffcd07;
  --bg: #000000; --surface: #0d0d0d; --surface-2: #161616; --cinza-5: #1f1f1f; --border: #2f2f2f; --campo: #5c5c5c;
  --text: #ededed; --muted: #a6a6a6; --on-azul: #000000;
  --menu-1: #111111; --menu-2: #181818; --menu-fundo: rgba(0, 0, 0, .86); --menu-on: #f2f2f2; --menu-on-fg: #000000; --menu-hover: #2f6fd6;
  --danger: #ff7a66; --warn: #ffcd07; --ok: #4dc966; --info: #9ec5fe;
  --preta: #ededed; --vermelha: #ff7a66; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--fonte); font-feature-settings: "lnum" 1; }
a { color: var(--azul); }
button, input, select, textarea { font: inherit; color: inherit; font-feature-settings: "lnum" 1; }
:focus-visible { outline: 3px dashed var(--foco); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; flex: none; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- cabeçalho no padrão gov.br */
header.hdr { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 2px solid var(--ouro); box-shadow: var(--shadow); }
.hdr-top { display: flex; align-items: center; gap: 16px; padding-block: 12px 4px; }
.marca { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--text); cursor: pointer; min-width: 0; }
.sigla { font-weight: 800; font-size: 24px; letter-spacing: -.5px; color: var(--azul-escuro); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.sigla svg { width: 26px; height: 26px; color: var(--azul); }
.sigla img.simb { height: 44px; width: auto; display: block; }
.menu .rodape .sigla img.simb { height: 34px; }
.marca .sep, .vsep { width: 1px; align-self: stretch; background: var(--border); min-height: 32px; }
.org { font-size: 13px; line-height: 1.35; max-width: 260px; }
.links { display: flex; gap: 20px; font-size: 14px; font-weight: 600; }
.links a { text-decoration: none; cursor: pointer; white-space: nowrap; }
.links a:hover { text-decoration: underline; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px; border-radius: 100em; border: 1px solid var(--azul); background: var(--azul); color: var(--on-azul); font-weight: 600; font-size: 15px; cursor: pointer; white-space: nowrap; }
.pill.out { background: var(--surface); color: var(--azul); }
.pill:hover { filter: brightness(1.1); } .pill.out:hover { background: var(--azul-claro); filter: none; }
.pill.ico { width: 32px; padding: 0; justify-content: center; }
/* Tela cheia: o conteúdo usa a largura toda (bom para a escala e o quadro de folgas). */
body.cheia .wrap { max-width: none; }
.pop-wrap { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 8px); background: var(--surface); border-radius: 8px; box-shadow: 0 4px 18px rgba(0,0,0,.2); padding: 8px 0; min-width: 240px; z-index: 40; border: 1px solid var(--border); }
.pop button, .pop a { display: block; width: 100%; text-align: left; padding: 9px 16px; background: none; border: 0; cursor: pointer; color: var(--azul); font-weight: 500; text-decoration: none; }
.pop button:hover, .pop a:hover { background: var(--azul-claro); }
.pop .info { padding: 6px 16px 10px; border-bottom: 1px solid var(--border); margin-bottom: 4px; font-size: 13px; color: var(--muted); }
.pop .info b { display: block; color: var(--text); font-size: 15px; }
.hdr-bot { display: flex; align-items: center; gap: 12px; padding-block: 10px 14px; }
.hamb { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--azul); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.hamb:hover { background: var(--azul-claro); }
.hamb svg { width: 22px; height: 22px; }
.sistema { font-size: 24px; font-weight: 400; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.busca { display: flex; align-items: center; background: var(--cinza-5); border-radius: 6px; height: 48px; width: min(345px, 100%); padding: 0 6px 0 16px; }
.busca input[type=search] { border: 0; border-radius: 0; background: none; flex: 1; min-width: 0; height: 100%; font-style: italic; padding: 0; }
.busca input:focus { outline: none; }
.busca:focus-within { outline: 3px dashed var(--foco); outline-offset: 2px; }
.busca button { width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; color: var(--azul); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.busca button:hover { background: var(--azul-claro); }
.grow { flex: 1; }

/* ---------- menu principal (duas colunas, como o menu do gov.br) */
.menu { position: absolute; left: 0; right: 0; top: 100%; height: calc(100vh - var(--hdr-h, 160px)); background: var(--menu-fundo); display: flex; overflow: hidden; }
.menu .col { overflow-y: auto; padding-block: 24px; }
.menu .c1 { width: max(300px, calc((100vw - 1280px) / 2 + 280px)); padding-left: max(16px, calc((100vw - 1280px) / 2 + 16px)); background: var(--menu-1); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.menu .c2 { width: 280px; background: var(--menu-2); padding-inline: 4px; }
.menu .it { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; color: var(--text); padding: 6px 12px; font-size: 15.5px; line-height: 1.35; cursor: pointer; min-height: 34px; }
.menu .c1 .it:hover, .menu .c1 .it.aberto { background: var(--menu-hover); color: #fff; }
.menu .c1 .it.on { background: var(--menu-on); color: var(--menu-on-fg); }
.menu .c2 .it { color: var(--muted); }
.menu .c2 .it:hover { color: var(--azul); text-decoration: underline; }
.menu .c2 .it.on { color: var(--text); font-weight: 700; }
.menu .c2 .tit { font-weight: 700; color: var(--text); padding: 0 12px 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; display: flex; align-items: center; gap: 6px; }
.menu .chev { font-size: 18px; line-height: 1; opacity: .8; }
.menu .area-tit { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 12px 12px 2px; border-top: 1px solid var(--border); margin-top: 6px; }
.menu .area-tit:empty { padding: 0; }
.menu .rodape { margin-top: auto; border-top: 1px solid var(--border); padding: 18px 12px 0; margin-right: 0; color: var(--muted); font-size: 13px; }
.menu .rodape .sigla { color: var(--muted); font-size: 22px; }
.menu .voltar { display: none; }

/* ---------- conteúdo */
main { padding-block: 16px 64px; min-height: 60vh; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); margin-bottom: 18px; }
.crumb a { cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.crumb a:hover { text-decoration: underline; }
.crumb .sep { font-size: 16px; color: var(--muted); }
h2 { margin: 0 0 6px; font-size: 28px; font-weight: 600; color: var(--text); text-wrap: balance; }
h3 { margin: 22px 0 10px; font-size: 18px; font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 20px; max-width: 75ch; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
.bar .grow { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 20px; border-radius: 100em; border: 1px solid var(--azul); background: var(--surface); color: var(--azul); font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--azul-claro); }
.btn.pri { background: var(--azul); color: var(--on-azul); }
.btn.pri:hover { background: var(--azul-escuro); border-color: var(--azul-escuro); }
.btn.dng { color: var(--danger); border-color: var(--danger); }
.btn.sm { height: 30px; padding: 0 14px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=date], input[type=number], input[type=month], input[type=email], input[type=search], select, textarea {
  height: 40px; padding: 0 12px; border: 1px solid var(--campo); border-radius: 6px; background: var(--surface); width: 100%; min-width: 0;
}
textarea { height: auto; padding: 8px 12px; min-height: 90px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13.5px; }
input[type=file] { max-width: 100%; }
.bar input, .bar select { width: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-bottom: 20px; }
.card { background: var(--surface); border-radius: 8px; padding: 16px 18px; box-shadow: var(--shadow); border: 1px solid var(--cinza-5); min-width: 0; }
.card h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.big { font-size: 32px; font-weight: 700; line-height: 1.1; color: var(--azul-escuro); }
.list { margin: 0; padding: 0; list-style: none; }
.list li { padding: 6px 0; border-bottom: 1px solid var(--cinza-5); display: flex; gap: 8px; justify-content: space-between; }
.list li:last-child { border-bottom: 0; }
.list li .tag { white-space: normal; text-align: right; }
.tw { overflow-x: auto; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); border: 1px solid var(--cinza-5); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--cinza-5); text-align: left; vertical-align: top; }
th { background: var(--surface-2); font-size: 13px; font-weight: 700; color: var(--text); position: sticky; top: 0; border-bottom: 2px solid var(--border); }
tbody tr:hover td { background: color-mix(in srgb, var(--azul-claro) 45%, transparent); }
tr:last-child td { border-bottom: 0; }
td.acts { white-space: nowrap; text-align: right; }
.num { text-align: right; font-variant-numeric: tabular-nums lining-nums; }
.tag { display: inline-block; padding: 2px 10px; border-radius: 100em; font-size: 12.5px; font-weight: 600; background: var(--cinza-5); color: var(--muted); white-space: nowrap; }
.tag.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.tag.warn { color: var(--warn); background: color-mix(in srgb, var(--ouro) 22%, transparent); }
.tag.dng { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
.tag.info { color: var(--info); background: color-mix(in srgb, var(--info) 12%, transparent); }
.tag.preta { background: var(--preta); color: var(--surface); } .tag.vermelha { background: var(--vermelha); color: #fff; }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 18px; cursor: pointer; border-bottom: 4px solid transparent; color: var(--muted); white-space: nowrap; font-weight: 600; margin-bottom: -1px; }
.tabs button:hover { color: var(--azul); background: var(--azul-claro); }
.tabs button.on { color: var(--azul); border-bottom-color: var(--azul); }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.ord-th { cursor: pointer; user-select: none; white-space: nowrap; }
.ord-th .ord-ic { margin-left: 4px; font-size: 10px; opacity: .35; }
.ord-th[aria-sort="ascending"] .ord-ic, .ord-th[aria-sort="descending"] .ord-ic, .ord-th:hover .ord-ic { opacity: 1; }
.itens-caut { display: grid; gap: 8px; counter-reset: item; }
.item-caut { display: grid; grid-template-columns: 26px 90px 1fr 1fr 36px; gap: 6px 10px; align-items: end; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; counter-increment: item; }
.item-caut label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; font-weight: 600; margin: 0; }
.item-caut input { width: 100%; }
.item-caut .ord { grid-row: 1 / 3; align-self: start; padding-top: 24px; font-weight: 700; color: var(--muted); }
.item-caut .ord::before { content: counter(item, decimal-leading-zero); }
.item-caut .ic-esp { grid-column: 2 / 6; }
.item-caut .ic-x { grid-column: 5; grid-row: 2; height: 40px; }
.item-caut .ic-info { grid-column: 2 / 6; font-size: 12px; }
.item-caut .ic-info:empty { display: none; }
@media (max-width: 600px) { .item-caut { grid-template-columns: 22px 70px 1fr 36px; } .item-caut .ic-esp, .item-caut .ic-info { grid-column: 2 / 5; } .item-caut .ic-dest { grid-column: 2 / 4; } .item-caut .ic-x { grid-column: 4; grid-row: auto; } }
.escala td { padding: 4px 6px; }
.escala td.dia { white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 12px; }
.escala tr.v td.dia { color: var(--vermelha); font-weight: 700; }
.escala tr.hoje td { background: color-mix(in srgb, var(--ouro) 18%, transparent); }
.escala select { height: 34px; padding: 0 6px; font-size: 13.5px; min-width: 150px; }
fieldset.pm { border: 1px solid var(--border); border-radius: 6px; margin: 12px 0 0; padding: 8px 12px 10px; }
fieldset.pm legend { font-weight: 600; font-size: 14px; padding: 0 4px; }
.pm-t { display: grid; gap: 6px; margin-bottom: 4px; }
.pm-t label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.pm-t input[type=number] { width: 64px; height: 32px; }
.doc .quebra { break-after: page; page-break-after: always; height: 0; }
.qf { overflow-x: auto; padding-bottom: 6px; }
.qf-r { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.qf > .qf-r { min-width: max-content; }
.qf-f { display: flex; justify-content: center; align-items: flex-start; gap: 14px; padding-top: 14px; border-top: 2px solid var(--border); align-self: stretch; }
.qf-c { width: 250px; margin: 0; }
.qf-l { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.btn-importar { float: right; margin-top: -40px; }

const Demo = {
  KEY: 'sistema-cia-demo-v2',

let MIL = {}, MAT = {}, TIPO = {}, FERIADO = {}, ESC_DIA = {};
function indexar() {
  MIL = Object.fromEntries(S.db.Militares.map(m => [m.id, m]));
  MAT = Object.fromEntries(S.db.Material.map(m => [m.id, m]));
  TIPO = Object.fromEntries(S.db.TiposServico.map(t => [t.id, t]));
  FERIADO = Object.fromEntries(S.db.Feriados.map(f => [f.data, f.descricao]));
  ESC_DIA = {};
  S.db.Escala.forEach(e => { (ESC_DIA[e.data] ||= []).push(e); });
}
const postoIdx = p => { const i = POSTOS.indexOf(p); return i < 0 ? 99 : i; };
const nomeMil = m => { m = typeof m === 'string' ? MIL[m] : m; return m ? [m.postoGrad, m.numero, m.nomeGuerra].filter(Boolean).join(' ') : '—'; };
const ordemMil = (a, b) => postoIdx(a.postoGrad) - postoIdx(b.postoGrad) || num(a.antiguidade) - num(b.antiguidade) || String(a.nomeGuerra).localeCompare(b.nomeGuerra);
const militaresAtivos = () => S.db.Militares.filter(m => sim(m.ativo)).sort(ordemMil);
const tiposAtivos = () => S.db.TiposServico.filter(t => sim(t.ativo)).sort((a, b) => num(a.ordem) - num(b.ordem));
const corDoDia = iso => { const w = dataDe(iso).getDay(); return (w === 0 || w === 6 || FERIADO[iso]) ? 'V' : 'P'; };
const missaoAtiva = m => m.status !== 'Cancelada' && m.status !== 'Concluída';

/** Situação do militar numa data: impedimento, missão ou pronto. */
function situacao(militarId, iso) {
  const imp = S.db.Impedimentos.find(i => i.militarId === militarId && i.inicio <= iso && (i.fim || i.inicio) >= iso);
  if (imp) return { tipo: 'imp', texto: imp.tipo, ate: imp.fim };
  const mis = S.db.Missoes.find(m => m.status !== 'Cancelada' && ids(m.militaresIds).concat(m.responsavelId || []).includes(militarId) && m.inicio <= iso && (m.fim || m.inicio) >= iso);
  if (mis) return { tipo: 'missao', texto: 'Missão: ' + mis.titulo, ate: mis.fim };
  const pun = S.db.Disciplina && punicaoEmCurso(militarId, iso);
  if (pun) return { tipo: 'imp', texto: 'Cumprindo punição', ate: fimPunicao(pun) };
  return { tipo: 'pronto', texto: 'Pronto' };
}
const tagSituacao = s => `<span class="tag ${s.tipo === 'pronto' ? 'ok' : s.tipo === 'missao' ? 'info' : 'warn'}">${esc(s.texto)}${s.ate ? ' até ' + fmt(s.ate) : ''}</span>`;
const aptoPara = (m, tipo) => ids(tipo.postos).includes(m.postoGrad);
/** O serviço ocorre neste dia? (todos, só dias úteis/preta ou só sáb-dom-feriado/vermelha) */
const aplica = (tipo, iso) => !tipo.dias || tipo.dias === 'Todos' || (tipo.dias === 'Preta') === (corDoDia(iso) === 'P');
/** Quantos militares o serviço tem por dia (ex.: 2 sentinelas). */
const qtdTipo = tipo => Math.max(1, Math.floor(num(tipo.qtd)) || 1);
/** Lançamentos de um serviço num dia. militarId vazio = vaga deixada em branco de propósito (não sai no aditamento). */
/** Serviços que dividem a mesma escala de folga (ex.: Sentinela e Permanência, ambos "Soldados"). */
const chaveFolga = t => t && t.folga ? 'g:' + norm(t.folga) : (t || {}).id;
const tiposDaFolga = tipoId => { const k = chaveFolga(TIPO[tipoId]); return S.db.TiposServico.filter(t => chaveFolga(t) === k).map(t => t.id).concat(TIPO[tipoId] ? [] : [tipoId]); };
const nomeFolga = tipoId => { const tp = TIPO[tipoId], l = tiposDaFolga(tipoId).map(id => TIPO[id]).filter(t => t && sim(t.ativo)); return tp && tp.folga && l.length > 1 ? `${tp.folga} (${l.map(t => t.nome).join(' + ')})` : (tp || {}).nome || ''; };
/** Folga corrida: conta todos os dias desde o último serviço, sem separar preta e vermelha. */
const folgaCorrida = tipoId => tiposDaFolga(tipoId).some(id => TIPO[id] && TIPO[id].contagem === 'Corrida');
const lancamentos = (iso, tipoId) => (ESC_DIA[iso] || []).filter(x => x.tipoId === tipoId);
const emBranco = e => !e.militarId;
/** Troca de serviço (controle interno): quem tira é e.troca; a folga continua contando para o escalado (e.militarId). */
const quemTira = e => e.troca || e.militarId;
/** Vagas do dia: a quantidade do serviço (se ocorre no dia) ou mais, se foram lançadas vagas extras. */
const vagasDoDia = (tipo, iso) => Math.max(aplica(tipo, iso) ? qtdTipo(tipo) : 0, lancamentos(iso, tipo.id).length);
const faltamNoDia = (tipo, iso) => Math.max(0, (aplica(tipo, iso) ? qtdTipo(tipo) : 0) - lancamentos(iso, tipo.id).length);

/**
 * Folga = quantidade de dias da mesma cor (preta = dias úteis, vermelha = sáb/dom/feriado)
 * desde o último serviço do militar naquele serviço (ou em qualquer serviço da mesma escala de folga). Quem nunca tirou tem folga infinita.
 */
function calcFolga(militarId, tipoId, cor, iso, entradas) {
  let ultimo = null;
  const grupo = new Set(tiposDaFolga(tipoId)), corrida = folgaCorrida(tipoId);
  for (const e of entradas) if (e.militarId === militarId && grupo.has(e.tipoId) && (corrida || corDoDia(e.data) === cor) && e.data < iso && (!ultimo || e.data > ultimo)) ultimo = e.data;
  if (!ultimo) return { folga: Infinity, ultimo: null };
  let n = 0;
  for (let d = addDias(ultimo, 1); d < iso; d = addDias(d, 1)) if (corrida || corDoDia(d) === cor) n++;
  return { folga: n, ultimo };
}

/**
 * Preenche os serviços vazios entre `inicio` e `fim` escolhendo, para cada dia e tipo,
 * o militar apto e disponível com maior folga na cor do dia. Empate: o mais moderno.
 * Regras: não escala impedido/em missão, nem em dois serviços no mesmo dia, nem em dias seguidos.
 */
function gerarEscala(inicio, fim, existentes, filtro = {}) {
  const entradas = existentes.slice();
  const ocupado = new Set(entradas.flatMap(e => [e.militarId + '|' + e.data, quemTira(e) + '|' + e.data]));
  const novos = [], faltas = [];
  for (let d = inicio; d <= fim; d = addDias(d, 1)) {
    const cor = corDoDia(d);
    for (const tipo of tiposAtivos()) {
      if (tipo.automatico === 'Não' || !aplica(tipo, d) || (filtro.tipos && !filtro.tipos.includes(tipo.id))) continue;
      // vagas já lançadas (com militar ou em branco) contam como preenchidas
      const precisa = filtro.qtd && filtro.qtd[tipo.id] !== undefined ? filtro.qtd[tipo.id] : qtdTipo(tipo);
      for (let k = entradas.filter(e => e.data === d && e.tipoId === tipo.id).length; k < precisa; k++) {
        const cands = militaresAtivos().filter(m => aptoPara(m, tipo) && (!filtro.postos || filtro.postos.includes(m.postoGrad))
          && situacao(m.id, d).tipo === 'pronto'
          && !ocupado.has(m.id + '|' + d) && !ocupado.has(m.id + '|' + addDias(d, -1)) && !ocupado.has(m.id + '|' + addDias(d, 1)));
        if (!cands.length) { faltas.push(`${fmt(d)} – ${tipo.nome}`); break; }
        const escolhido = cands.map(m => ({ m, f: calcFolga(m.id, tipo.id, cor, d, entradas).folga }))
          .sort((a, b) => b.f - a.f || postoIdx(b.m.postoGrad) - postoIdx(a.m.postoGrad) || num(b.m.antiguidade) - num(a.m.antiguidade))[0].m;
        const e = { id: uid(), data: d, tipoId: tipo.id, militarId: escolhido.id, cor, obs: filtro.lote ? PRE + filtro.lote : '' };
        entradas.push(e); novos.push(e); ocupado.add(escolhido.id + '|' + d);
      }
    }
  }
  return { novos, faltas };
}

function alertasEscala(e) {
  const a = [];
  if (emBranco(e)) return a;
  const s = situacao(quemTira(e), e.data);
  if (s.tipo !== 'pronto') a.push(s.texto);
  const doMil = S.db.Escala.filter(x => quemTira(x) === quemTira(e) && x.id !== e.id);
  if (doMil.some(x => x.data === e.data)) a.push('dois serviços no mesmo dia');
  if (doMil.some(x => x.data === addDias(e.data, -1) || x.data === addDias(e.data, 1))) a.push('serviço em dias seguidos');
  return a;
}

    <div class="acts"><button type="button" class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" ${pode() ? '' : 'disabled'}>Salvar</button></div></form></div>`;
  $('#frm').onsubmit = async ev => {
    ev.preventDefault();
    const btn = $('#frm .btn.pri'); btn.disabled = true;
    try {
      const obj = { ...valores };

        const el = $('#f_' + c.k);
        if (c.t === 'militares' || c.t === 'postos' || c.t === 'areas') obj[c.k] = $$('input:checked', el).map(i => i.value).join(',');
        else if (c.t === 'file') { const url = await enviarArquivo(el.files[0]); if (url) obj[c.k] = url; }
        else obj[c.k] = el.value.trim();
        if (c.t === 'postos' && c.req && !obj[c.k]) throw new Error('Marque pelo menos um posto ou graduação.');
      }
      await aoSalvar(obj);
      fecharModal(); render();
    } catch (e) { btn.disabled = false; if (!/Erro ao salvar/.test(e.message)) toast(e.message, true); }

/** Diálogo da própria página (o navegador pode bloquear confirm/prompt). Com `campo`, devolve o valor digitado ou null. */
function dialogo({ msg, campo, valor, ok = 'Confirmar' }) {
  return new Promise(res => {
    const el = $('#dialog');
    el.innerHTML = `<div class="modal-bg" style="z-index:70"><form class="modal" id="dlg" style="max-width:440px"><p style="margin-top:0">${esc(msg)}</p>${campo ? `<input type="${campo}" id="dlg_v" value="${esc(valor || '')}">` : ''}
      <div class="acts"><button type="button" class="btn" id="dlg_nao">Cancelar</button><button class="btn pri">${esc(ok)}</button></div></form></div>`;
    const fim = v => { el.innerHTML = ''; res(v); };
    $('#dlg_nao').onclick = () => fim(campo ? null : false);
    $('#dlg').onsubmit = e => { e.preventDefault(); fim(campo ? $('#dlg_v').value : true); };
    (campo ? $('#dlg_v') : $('#dlg .pri')).focus();
  });
}
const confirmar = msg => dialogo({ msg });

  m = t.match(/^-?[\d.]+(,\d+)?(?=\s|$)/); if (m) return { n: num(m[0].replace(/\./g, '').replace(',', '.')) };
  return { t };
}
function compararOrd(a, b) {
  if (a.d !== undefined && b.d !== undefined) return a.d.localeCompare(b.d);
  if (a.n !== undefined && b.n !== undefined) return a.n - b.n;
  const x = a.t ?? a.d ?? String(a.n), y = b.t ?? b.d ?? String(b.n);
  return !x ? 1 : !y ? -1 : x.localeCompare(y, 'pt-BR', { numeric: true, sensitivity: 'base' });
}
function ordenar(th) {
  S.ordem ||= {};
  const k = th.dataset.k, i = +th.dataset.i, o = S.ordem[k];
  S.ordem[k] = !o || o.i !== i ? { i, dir: 1 } : o.dir === 1 ? { i, dir: -1 } : null;
  render();
}
function tabela(linhas, cols, acoes) {
  if (!linhas.length) return '<div class="tw"><div class="empty">Nenhum registro.</div></div>';
  const k = S.view + '|' + (S.sub[S.view] || '') + '|' + cols.map(c => c.l).join(','), o = (S.ordem || {})[k];
  if (o && cols[o.i]) { const c = cols[o.i]; linhas = linhas.map(r => [r, valorOrd(textoCel(c.s ? c.s(r) : c.v(r)))]).sort((x, y) => compararOrd(x[1], y[1]) * o.dir).map(x => x[0]); }
  return `<div class="tw"><table><thead><tr>${cols.map((c, i) => `<th class="${c.c || ''} ord-th" data-k="${esc(k)}" data-i="${i}" onclick="ordenar(this)" title="Ordenar por ${esc(c.l)}" aria-sort="${o && o.i === i ? (o.dir === 1 ? 'ascending' : 'descending') : 'none'}">${esc(c.l)}<span class="ord-ic">${o && o.i === i ? (o.dir === 1 ? '▲' : '▼') : '↕'}</span></th>`).join('')}${acoes ? '<th></th>' : ''}</tr></thead><tbody>
    ${linhas.map(r => `<tr>${cols.map(c => `<td class="${c.c || ''}">${c.v(r)}</td>`).join('')}${acoes ? `<td class="acts">${acoes(r)}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;

function htmlDoc(blocos) {
  const corpo = blocos.map(b => {
    if (b.paisagem || b.cont || b.moldura) return '';
    if (b.hr) return '<hr>';
    if (b.quebra) return '<div class="quebra"></div>';
    if (b.pont) return `<p class="pont" style="${b.mt ? `margin-top:${b.mt}pt;` : ''}${b.ind ? `padding-left:${b.ind}pt;` : ''}${b.sz ? `font-size:${b.sz}pt` : ''}"><span>${htmlRico(b.pont[0])}</span><span class="pt"></span><span>${htmlRico(b.pont[1])}</span></p>`;
    if (b.esp) return `<div style="height:${b.esp * 1.25}em"></div>`;
    if (b.img) return `<p class="c"><img src="${b.img}" alt="" style="width:${b.w || 56}pt"></p>`;
    if (b.t) {
      const cols = b.w ? `<colgroup>${b.w.map(x => `<col style="width:${x}%">`).join('')}</colgroup>` : '';
      return `<table class="${b.sem ? 'sem' : ''} ${b.esq ? 'esq' : ''} ${b.centro ? 'centro' : ''}" style="font-size:${b.sz || 9}pt">${cols}${b.t.map((linha, r) => `<tr>${linha.map(c => {
        const o = c && typeof c === 'object' ? c : { v: c };
        const cls = [(o.b || r < (b.h || 0)) ? 'b' : '', o.i ? 'i' : '', o.l ? 'l' : o.c ? 'c' : ''].join(' ').trim();
        return `<td${o.span > 1 ? ` colspan="${o.span}"` : ''}${cls ? ` class="${cls}"` : ''}>${(o.m ? htmlRico(o.v) : esc(o.v ?? '')) || '\u00a0'}</td>`;
      }).join('')}</tr>`).join('')}</table>`;
    }
    const cls = [b.c ? 'c' : b.r ? 'r' : b.l ? 'l' : 'j', b.b ? 'b' : '', b.i ? 'i' : ''].join(' ');
    return `<p class="${cls}" style="${b.junto ? 'break-after:avoid;page-break-after:avoid;' : ''}${b.mt ? `margin-top:${b.mt}pt;` : ''}${b.ind ? `padding-left:${b.ind}pt;` : ''}${b.sz ? `font-size:${b.sz}pt` : ''}">${(b.m ? htmlRico(b.p) : esc(b.p)) || '\u00a0'}</p>`;
  }).join('');
  return '<div class="doc">' + (blocos.some(b => b.moldura) ? `<div class="moldura">${corpo}</div>` : corpo) + '</div>';
}
/**
 * Página do documento. Com o bloco { cont: { esq: [linhas], dir: [linhas] } }, da 2ª página em diante sai um cabeçalho de
 * continuação no alto (ex.: "Continuação das Folhas de Alterações"), com "Folha Nr 02, 03…" pela numeração da página.
 */
const paginaCss = d => {
  const base = d.blocos.some(b => b.paisagem) ? '@page { size: A4 landscape; margin: 12mm; }' : '@page { size: A4; margin: 15mm 15mm 15mm 22mm; }';
  const c = (d.blocos.find(b => b.cont) || {}).cont;
  if (!c) return base;
  const q = l => '"' + l.map(x => String(x).replace(/["\\]/g, '')).join('\\A ') + '"';
  return base + ` @page { margin-top: 30mm; @top-left { content: ${q(c.esq)}; white-space: pre; font: 9.5pt Arial, sans-serif; vertical-align: bottom; padding-bottom: 3mm; border-bottom: 1px solid #000; }
    @top-right { content: "Folha Nr " counter(page, decimal-leading-zero) "\\A ${(c.dir || []).map(x => String(x).replace(/["\\]/g, '')).join('\\A ')}"; white-space: pre; text-align: right; font: 9.5pt Arial, sans-serif; vertical-align: bottom; padding-bottom: 3mm; border-bottom: 1px solid #000; } }
    @page :first { margin-top: 15mm; @top-left { content: none; border: 0; } @top-right { content: none; border: 0; } }`;
};
/** Texto com marcação simples: **negrito** e __sublinhado__ (pode combinar). */
function trechosRicos(t) {
  const out = []; let b = false, u = false;
  String(t ?? '').split(/(\*\*|__)/).forEach(x => { if (x === '**') b = !b; else if (x === '__') u = !u; else if (x) out.push({ t: x, b, u }); });
  return out;
}
const htmlRico = t => trechosRicos(t).map(x => { let h = esc(x.t); if (x.u) h = `<u>${h}</u>`; if (x.b) h = `<b>${h}</b>`; return h; }).join('');

/** Documentos do sistema: cada função recebe um argumento e devolve { tipo, titulo, ref, blocos }. */
const DOCS = {};
/** Saídas de um documento: imprimir (navegador), PDF arquivado no Drive ou Google Doc editável. */
async function emitir(chave, arg, modo) {
  let d;
  try { d = DOCS[chave](arg); } catch (e) { return toast('Não foi possível montar o documento: ' + e.message, true); }
  if (!d) return;
  if (modo === 'pdf') return arquivarPdf(d);
  if (modo === 'doc') return gerarDoc(d);
  $('#print').innerHTML = `<style>@media print { ${paginaCss(d)} }</style>` + htmlDoc(d.blocos);
  setTimeout(() => window.print(), 50);
}
const arg = v => v === undefined ? 'undefined' : `'${esc(v)}'`;
const botoesDoc = (chave, valor, rotulo = 'Imprimir') => `<button class="btn sm" onclick="emitir('${chave}',${arg(valor)})">${rotulo}</button>${pode() ? ` <button class="btn sm" onclick="emitir('${chave}',${arg(valor)},'pdf')" title="Gera o PDF e guarda na pasta de arquivo do Drive">PDF</button> <button class="btn sm" onclick="emitir('${chave}',${arg(valor)},'doc')" title="Cria um Google Doc editável (baixa como Word)">Editável</button>` : ''}`;
const botoesDocGrandes = (chave, valor, excel) => `<button class="btn" onclick="emitir('${chave}',${arg(valor)})">Imprimir</button>${pode() ? `<button class="btn" onclick="emitir('${chave}',${arg(valor)},'pdf')">Salvar PDF</button><button class="btn" onclick="emitir('${chave}',${arg(valor)},'doc')" title="Google Doc editável; no Docs, Arquivo → Fazer download → Word">Editável (Doc/Word)</button>` : ''}${excel ? `<button class="btn" onclick="exportarExcel('${excel}')">Excel</button>` : ''}`;

function registrarDocumento(reg, d) {
  S.db.Documentos.push(reg);
  if (d.tipo === 'Aditamentos' && d.ref) {
    const campo = reg.formato === 'Google Doc' ? 'docUrl' : 'pdfUrl';
    const ad = S.db.Aditamentos.find(a => a.id === d.ref); if (ad) ad[campo] = reg.url;
    if (S.adEdit && S.adEdit.id === d.ref) S.adEdit[campo] = reg.url;
  }
  render();
}
async function arquivarPdf(d) {
  const titulo = d.titulo.replace(/[\\/:*?"<>|]/g, '-');
  const completo = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>${paginaCss(d)} body { margin: 0; } ${CSS_DOC}</style></head><body>${htmlDoc(d.blocos)}</body></html>`;
  try {
    toast('Gerando PDF e arquivando no Drive…');
    const reg = await api('salvarPdf', d.tipo, titulo, completo, d.ref || '');
    registrarDocumento(reg, d);
    const onde = `PDFs / ${d.tipo} / ${new Date().getFullYear()} / ${pad(new Date().getMonth() + 1)} - ${MESES_EXT[new Date().getMonth()].replace(/^./, c => c.toUpperCase())}`;
    if (!NO_GOOGLE) return toast('Demonstração: na versão instalada o PDF é salvo no Drive em ' + onde + '.');
    avisoArquivo(reg, onde, 'PDF arquivado', 'Abrir PDF para imprimir');
    return reg;
  } catch (e) { toast('Não foi possível gerar o PDF: ' + e.message, true); }
}
async function gerarDoc(d) {
  try {
    toast('Criando Google Doc editável…');
    const reg = await api('criarDoc', d.tipo, d.titulo, d.blocos, d.ref || '');
    registrarDocumento(reg, d);
    const onde = `Google Docs / ${d.tipo} / ${new Date().getFullYear()}`;
    if (!NO_GOOGLE) return toast('Demonstração: na versão instalada é criado um Google Doc editável em ' + onde + '.');
    avisoArquivo(reg, onde, 'Documento editável criado', 'Abrir no Google Docs', 'Para Word: no Docs, Arquivo → Fazer download → Microsoft Word (.docx). Depois de editar, Arquivo → Fazer download → PDF.');
    return reg;
  } catch (e) { toast('Não foi possível criar o documento: ' + e.message, true); }
}
function avisoArquivo(reg, onde, titulo, botao, dica = '') {
  $('#dialog').innerHTML = `<div class="modal-bg" style="z-index:70" onclick="if(event.target===this)this.parentNode.innerHTML=''"><div class="modal" style="max-width:480px">
    <h3>${esc(titulo)}</h3><p><b>${esc(reg.titulo)}</b><br><span class="muted">Pasta do Drive: ${esc(onde)}</span></p>${dica ? `<p class="muted">${esc(dica)}</p>` : ''}
    <div class="acts"><button class="btn" onclick="$('#dialog').innerHTML=''">Fechar</button><a class="btn pri" href="${esc(reg.url)}" target="_blank" onclick="$('#dialog').innerHTML=''">${esc(botao)}</a></div></div></div>`;
}

/** Nome de arquivo seguro para download: o navegador descarta nomes com "ª", "º" e afins. */
const nomeArquivo = n => soAscii(String(n).replace(/ª/g, 'a').replace(/[º°]/g, 'o')).replace(/[^\w .()-]/g, '-');
/** Listas exportáveis para Excel: cada função devolve { nome, cab: [...], linhas: [[...]] }. */
const LISTAS = {};
async function exportarExcel(chave, arg) {
  try {
    const l = LISTAS[chave](arg);
    await carregarSheetJS();
    const ws = XLSX.utils.aoa_to_sheet([l.cab, ...l.linhas]);
    ws['!cols'] = l.cab.map((h, i) => ({ wch: Math.min(48, Math.max(String(h).length, ...l.linhas.map(r => String(r[i] ?? '').length)) + 2) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, l.nome.slice(0, 31).replace(/[\\/?*[\]:]/g, '-'));
    const blob = new Blob([XLSX.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nomeArquivo(l.nome) + '.xlsx';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    if (!NO_GOOGLE) toast('Na demonstração o download pode ser bloqueado; na versão instalada a planilha é baixada.');
  } catch (e) { toast('Não foi possível exportar: ' + e.message, true); }
}
/** Documento de uma lista: cabeçalho, título e a tabela (página deitada quando há muitas colunas). */
function docDeLista(l, tipo, titulo, extra = []) {

}

function TIPOS_DOC_MENU() { return [['Aditamentos', 'Aditamentos'], ['Escalas', 'Escalas'], ['Missoes', 'Ordens de missão'], ['Cautelas', 'Cautelas'], ['Material', 'Relações de material'], ['Pedidos', 'Pedidos de material'], ['Efetivo', 'Tripão, chamada e férias']].map(([v, l]) => ({ l, filtro: ['docTipo', v] })); }
const subsDe = v => (SUBMENU[v] || []).filter(i => (!i.editor || podeEm(v)) && (!i.admin || admin()));
function subAtivo(v, i) {
  const lista = subsDe(v);
  if (i.ativo) return !!i.ativo();
  if (i.aba && (S.sub[v] || lista.find(x => x.aba).aba) !== i.aba) return false;
  if (i.aba && !i.filtro) return true;
  if (i.filtro) { const [f, val] = i.filtro; const pad0 = lista.find(x => x.filtro && x.filtro[0] === f).filtro[1]; return (S.filtro[f] ?? pad0) === val; }
  return false;
}
function irPara(v) { if (!podeVer(v) || !VIEWS_FN[v]) v = 'painel'; S.view = v; if (v !== 'aditamentos') S.adEdit = null; try { localStorage.setItem('cia-view', v); } catch (e) { } fecharMenu(); render(); window.scrollTo(0, 0); }
function irSub(v, idx) {
  const i = subsDe(v)[idx];
  if (i.aba) S.sub[v] = i.aba;
  if (i.filtro) S.filtro[i.filtro[0]] = i.filtro[1];
  irPara(v);
  if (i.acao) i.acao();
}
function alternarMenu(abrir) {
  S.menu = abrir ?? !S.menu;
  S.menuAberto = S.menu ? S.view : null; S.menuNivel2 = false;
  renderMenu();
}
function fecharMenu() { if (S.menu) alternarMenu(false); }
function hoverMenu(v) { if (S.menuAberto === v || matchMedia('(max-width: 760px)').matches) return; S.menuAberto = v; renderMenu(); }
function clicarMenu(v) {
  if (!subsDe(v).length) return irPara(v);
  if (matchMedia('(max-width: 760px)').matches) { S.menuAberto = v; S.menuNivel2 = true; return renderMenu(); }
  irPara(v);
}
function renderMenu() {
  const hamb = $('#hamb');
  hamb.innerHTML = S.menu ? ICO.fechar : ICO.menu;
  hamb.setAttribute('aria-expanded', S.menu ? 'true' : 'false');
  hamb.setAttribute('aria-label', S.menu ? 'Fechar menu' : 'Abrir menu');
  document.documentElement.style.setProperty('--hdr-h', $('#hdr').offsetHeight + 'px');
  if (!S.menu) { $('#menu').innerHTML = ''; return; }
  const aberto = S.menuAberto, subs = subsDe(aberto), nome = (VIEWS.find(x => x[0] === aberto) || [])[1];
  $('#menu').innerHTML = `<nav class="menu ${S.menuNivel2 ? 'nivel2' : ''}" aria-label="Menu principal" onclick="if(event.target===this)fecharMenu()">
    <div class="col c1">${VIEWS.filter(([k]) => podeVer(k)).map(([k, l, a], i, arr) => `${a && (i === 0 || arr[i - 1][2] !== a) ? `<div class="area-tit">${esc(AREAS[a])}</div>` : !a && i && arr[i - 1][2] ? '<div class="area-tit"></div>' : ''}<button class="it ${S.view === k ? 'on' : ''} ${aberto === k && S.view !== k ? 'aberto' : ''}" onmouseenter="hoverMenu('${k}')" onfocus="hoverMenu('${k}')" onclick="clicarMenu('${k}')">${esc(l)}${subsDe(k).length ? '<span class="chev">›</span>' : ''}</button>`).join('')}
      <div class="rodape"><div class="sigla">${marcaHTML()}</div><div>${esc(S.user?.email || '')}</div></div></div>
    ${subs.length ? `<div class="col c2"><button class="it voltar" onclick="S.menuNivel2=false;renderMenu()">‹ Voltar</button>
      <button class="it ${S.view === aberto ? 'on' : ''}" onclick="irPara('${aberto}')" style="font-weight:700;color:var(--text)">${esc(nome)}</button>
      ${subs.map((i, n) => `<button class="it ${S.view === aberto && subAtivo(aberto, i) ? 'on' : ''}" onclick="irSub('${aberto}', ${n})">${esc(i.l)}</button>`).join('')}</div>` : ''}

}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { fecharMenu(); fecharPops(); } });

// ---------- tema e tela cheia (preferência guardada só neste aparelho)
const temaPreto = () => document.documentElement.dataset.theme === 'dark';
function alternarTema() {
  const preto = !temaPreto();
  document.documentElement.dataset.theme = preto ? 'dark' : 'light';
  try { localStorage.setItem('cia-tema', preto ? 'dark' : 'light'); } catch (e) { S.semArmazenamento = true; }
  atualizarBotoesTopo();
}
async function alternarTelaCheia() {
  const ligada = document.fullscreenElement || document.body.classList.contains('cheia');
  try {
    if (ligada) { if (document.fullscreenElement) await document.exitFullscreen(); document.body.classList.remove('cheia'); }
    else {
      document.body.classList.add('cheia');
      if (document.fullscreenEnabled) await document.documentElement.requestFullscreen();
      else toast('Este navegador não deixa a página ocupar a tela toda; o conteúdo passou a usar a largura inteira. No computador, F11 também deixa em tela cheia.');
    }
  } catch (e) { toast('O navegador não liberou a tela cheia; o conteúdo passou a usar a largura inteira. No computador, tente F11.'); }
  atualizarBotoesTopo();
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('cheia'); atualizarBotoesTopo(); });
function atualizarBotoesTopo() {
  const t = $('#btnTema'), c = $('#btnCheia'), cheia = !!document.fullscreenElement || document.body.classList.contains('cheia');
  if (t) { t.innerHTML = temaPreto() ? ICO.sol : ICO.lua; t.title = temaPreto() ? 'Tema claro' : 'Tema preto'; t.setAttribute('aria-label', t.title); }
  if (c) { c.innerHTML = cheia ? ICO.sair : ICO.cheia; c.title = cheia ? 'Sair da tela cheia' : 'Tela cheia'; c.setAttribute('aria-label', c.title); }
}
function abrirPop(qual, ev) {
  ev.stopPropagation();
  const el = $('#pop-' + qual), estava = !el.hidden;
  fecharPops(); fecharMenu();
  if (estava) return;
  if (qual === 'atalhos') {
    const itens = pode() ? [['Nova missão', 'irPara(\'missoes\');editarMissao()'], ['Novo aditamento', 'irPara(\'aditamentos\');novoAditamento()'], ['Nova cautela de material', 'irPara(\'material\');novaCautela()'],
      ['Lançar afastamento', 'irPara(\'efetivo\');editarImp()'], ['Gerar escala do mês', 'irPara(\'escala\');gerarMes()'], ['Salvar PDF da escala do mês', 'emitir(\'escala\',S.mes,\'pdf\')'], ['Novo pedido de material', 'irPara(\'material\');editarPedido()']]
      : [['Serviço do mês', 'irPara(\'escala\')'], ['Missões', 'irPara(\'missoes\')'], ['Arquivo PDF', 'irPara(\'arquivo\')']];
    el.innerHTML = itens.map(([l, f]) => `<button onclick="fecharPops();${f}">${l}</button>`).join('');
  } else {
    el.innerHTML = `<div class="info"><b>${esc(S.user?.nome || '')}</b>${esc(S.user?.email || '')}<br>Perfil: ${esc(S.user?.perfil || '')}</div>
      ${admin() ? `<button onclick="fecharPops();S.sub.config='usuarios';irPara('config')">Gerenciar usuários</button>` : ''}
      <button onclick="fecharPops();S.sub.config='geral';irPara('config')">Configurações</button>
      <button onclick="fecharPops();alternarTema()">${temaPreto() ? 'Usar tema claro' : 'Usar tema preto'}</button>
      <button onclick="fecharPops();alternarTelaCheia()">${document.fullscreenElement || document.body.classList.contains('cheia') ? 'Sair da tela cheia' : 'Tela cheia'}</button>
      <button onclick="fecharPops();sairDoSistema()">Sair deste aparelho</button>
      ${!NO_GOOGLE ? `<button onclick="fecharPops();confirmar('Apagar os dados de demonstração?').then(s=>{if(s){Demo.resetar();iniciar()}})">Recomeçar demonstração</button>` : ''}`;
  }
  el.hidden = false;
}

// ---------- busca geral
function buscar(ev) { ev.preventDefault(); S.busca = $('#q').value.trim(); if (S.busca) irPara('busca'); }
function vBusca() {
  const q = norm(S.busca), tem = (...t) => t.some(x => norm(x).includes(q));
  const grupos = [
    ['Militares', S.db.Militares.filter(m => tem(nomeMil(m), m.nomeCompleto, m.idt, m.pelotao)).sort(ordemMil), m => esc(nomeMil(m)) + ` <span class="muted">${esc(m.nomeCompleto)}</span>`, m => `editarMil('${m.id}')`],
    ['Material', S.db.Material.filter(m => tem(m.patrimonio, m.descricao, m.localizacao)), m => `${esc(m.descricao)} <span class="muted">${esc(m.patrimonio)}</span>`, m => `editarMat('${m.id}')`],
    ['Missões', S.db.Missoes.filter(m => tem(m.titulo, m.local, m.descricao)), m => `${esc(m.titulo)} <span class="muted">${fmt(m.inicio)}</span>`, m => `editarMissao('${m.id}')`],
    ['Aditamentos', S.db.Aditamentos.filter(a => tem('aditamento ' + a.numero, a.parte1, a.parte2, a.parte3, a.parte4)), a => `Aditamento nº ${esc(a.numero)} <span class="muted">${fmt(a.data)}</span>`, a => `irPara('aditamentos');abrirAditamento('${a.id}')`],
    ['Arquivo', S.db.Documentos.filter(d => tem(d.titulo)), d => esc(d.titulo), d => d.url ? `window.open('${esc(d.url)}','_blank')` : `irPara('arquivo')`]
  ].filter(g => g[1].length);
  const total = grupos.reduce((n, g) => n + g[1].length, 0);
  return `<h2>Resultados da busca</h2><p class="sub">${total} resultado(s) para “${esc(S.busca)}”.</p>` + (grupos.map(([t, l, txt, acao]) =>
    `<div class="res"><h3>${t} <span class="tag">${l.length}</span></h3><div class="tw"><table><tbody>${l.slice(0, 30).map(r => `<tr><td>${txt(r)}</td><td class="acts"><button class="btn sm" onclick="${acao(r)}">Abrir</button></td></tr>`).join('')}</tbody></table></div></div>`).join('') || '<div class="card">Nada encontrado. Tente o nome de guerra, o número de patrimônio ou parte do nome da missão.</div>');
}

// ============================================================ painel
function vPainel() {
  const d = hoje(), amanha = addDias(d, 1);

  const sits = mil.map(m => situacao(m.id, d));
  const prontos = sits.filter(s => s.tipo === 'pronto').length;
  const emMissao = sits.filter(s => s.tipo === 'missao').length;
  const imped = mil.map(m => ({ m, s: situacao(m.id, d) })).filter(x => x.s.tipo === 'imp');
  const servico = dia => tiposAtivos().map(t => {
    const l = lancamentos(dia, t.id), nomes = l.filter(e => !emBranco(e)).map(e => esc(nomeMil(quemTira(e))));
    const falta = faltamNoDia(t, dia) ? ' <span class="tag warn">vazio</span>' : '';
    if (!l.length && !aplica(t, dia)) return '';
    return `<li><span class="muted">${esc(t.nome)}</span><b>${nomes.join(', ') || (falta ? '' : '<span class="muted">em branco</span>')}${falta}</b></li>`;

  const vencidas = abertas.filter(g => g.previsaoDevolucao && g.previsaoDevolucao < d);
  const manut = S.db.Material.filter(m => m.estado === 'Em manutenção' || m.estado === 'Inservível');

/**
 * Lê parcelas de férias escritas como na planilha: "- 10 a 19 FEV 27", "01 DEZ a 15 JAN 27", várias por linha;
 * ou uma data de início + período ("30 dias"). Devolve [{ inicio, fim }].
 */
function lerParcelas(texto, periodo, anoPadrao) {
  const MES = n => MESES.findIndex(m => norm(m) === norm(String(n).slice(0, 3)));
  const ano = y => !y ? anoPadrao : String(y).length === 2 ? 2000 + +y : +y;
  const t = String(texto || '').trim(), out = [];
  const inicioData = dataImportada(t);
  if (/^\d{4}-\d{2}-\d{2}$/.test(inicioData)) {
    const dias = parseInt(String(periodo).replace(/\D/g, ''), 10) || 30;
    return [{ inicio: inicioData, fim: addDias(inicioData, dias - 1) }];
  }
  const re = /(\d{1,2})\s*(?:([a-zç]{3})[a-zç.]*)?\s*(?:\/?\s*(\d{2,4}))?\s*(?:a|à|até|-)\s*(\d{1,2})\s*([a-zç]{3})[a-zç.]*\s*(\d{2,4})?/gi;
  let m;
  while ((m = re.exec(t))) {
    const m2 = MES(m[5]), m1 = m[2] ? MES(m[2]) : m2;
    if (m1 < 0 || m2 < 0) continue;
    const y2 = ano(m[6]), y1 = m[3] ? ano(m[3]) : (m1 > m2 ? y2 - 1 : y2);
    out.push({ inicio: `${y1}-${pad(m1 + 1)}-${pad(m[1])}`, fim: `${y2}-${pad(m2 + 1)}-${pad(m[4])}` });
  }
  return out;
}

function diasDoMes(ym) { const [y, m] = ym.split('-').map(Number); const n = new Date(y, m, 0).getDate(); return Array.from({ length: n }, (_, i) => `${ym}-${pad(i + 1)}`); }

/** Uma célula da escala (serviço × dia): as vagas com o militar, a troca e o botão de mais uma vaga. */
function celulaEscala(tp, d) {
  const l = lancamentos(d, tp.id), extra = (S.vagaExtra || {})[d + '|' + tp.id] || 0, n = vagasDoDia(tp, d) + extra;
  if (!n) return `<td class="muted" title="Este serviço não ocorre neste dia">·${pode() ? `<button class="mais" title="Lançar mesmo assim" aria-label="Lançar ${esc(tp.nome)} em ${fmt(d)}" onclick="maisVaga('${d}','${tp.id}')">+</button>` : ''}</td>`;
  const vagas = Array.from({ length: n }, (_, k) => {
    const e = l[k], al = e ? alertasEscala(e) : [];
    const aviso = al.length ? ` <span class="alerta" title="${esc(al.join('; '))}">⚠</span>` : '';
    const trc = e && e.troca ? `<div class="troca" title="Troca de serviço${e.trocaMotivo ? ': ' + esc(e.trocaMotivo) : ''}. A folga continua contando para o escalado.">⇄ tira: <b>${esc(nomeMil(e.troca))}</b></div>` : '';
    if (!pode()) return `<div>${e ? (emBranco(e) ? '<span class="muted">em branco</span>' : esc(nomeMil(e.militarId))) : '<span class="muted">—</span>'}${aviso}${trc}</div>`;
    const ops = militaresAtivos().filter(m => aptoPara(m, tp) || (e && e.militarId === m.id))
      .map(m => { const s = situacao(m.id, d); return `<option value="${m.id}" ${e && e.militarId === m.id ? 'selected' : ''}>${esc(nomeMil(m))}${s.tipo !== 'pronto' ? ' (' + esc(s.texto) + ')' : ''}</option>`; }).join('');
    const sobra = k >= (aplica(tp, d) ? qtdTipo(tp) : 0);
    return `<div class="vaga"><select class="${e && emBranco(e) ? 'branco' : ''}" aria-label="${esc(tp.nome)}${n > 1 ? ' ' + (k + 1) : ''} em ${fmt(d)}" onchange="${e && !emBranco(e) ? `if(this.value==='${TROCA}'){this.value='${e.militarId}';trocaServico('${e.id}')}else ` : ''}trocarServico('${d}','${tp.id}',${k},this.value)"><option value="">${sobra ? '— tirar esta vaga —' : '—'}</option><option value="${BRANCO}" ${e && emBranco(e) ? 'selected' : ''}>Em branco</option>${e && !emBranco(e) ? `<option value="${TROCA}">⇄ ${e.troca ? 'Troca de serviço (alterar ou desfazer)…' : 'Troca de serviço…'}</option>` : ''}${ops}</select>${aviso}${trc}</div>`;
  }).join('');
  return `<td>${vagas}${pode() ? `<button class="mais" title="Mais um militar neste dia" aria-label="Mais um ${esc(tp.nome)} em ${fmt(d)}" onclick="maisVaga('${d}','${tp.id}')">+</button>` : ''}</td>`;
}

const folgaTipo = () => { const t = S.filtro.folgaTipo && TIPO[S.filtro.folgaTipo] ? S.filtro.folgaTipo : (tiposAtivos()[0] || {}).id; return t && (opcoesFolga().find(o => tiposDaFolga(o).includes(t)) || t); };

/** Matriz do quadro: para cada militar apto, o valor de cada dia do mês. */
function matrizFolgas(tipoId, ym) {
  const tp = TIPO[tipoId], dias = diasDoMes(ym);
  const grupo = tiposDaFolga(tipoId), servicos = S.db.Escala.filter(e => grupo.includes(e.tipoId)), corrida = folgaCorrida(tipoId);
  const serviu = new Set(servicos.map(e => e.militarId + '|' + e.data));
  return militaresAtivos().filter(m => grupo.some(id => TIPO[id] && aptoPara(m, TIPO[id]))).map(m => {
    // Contador = dias da mesma cor desde o último serviço, contando o próprio dia (como na planilha).
    const c = { P: calcFolga(m.id, tipoId, 'P', dias[0], servicos).folga, V: calcFolga(m.id, tipoId, 'V', dias[0], servicos).folga };
    if (corrida) c.V = c.P;

function vImportarHistorico() {
  const st = S.hist;
  let html = `<div class="card"><p>Traga a sua planilha de escala no formato de <b>colunas por dia</b> (como a de Sgt de Dia ou Cabo de Dia): uma linha por militar com P/G e nome, e a cada dia o contador de folga, com <b>0 no dia em que tirou serviço</b>. O sistema lê os zeros e recria o histórico, então as folgas continuam exatamente de onde estavam.</p>

    </div><div class="bar" style="margin-top:12px"><span class="muted grow">${aba.militares.filter(x => achaMilitar(x.nome, x.posto)).length} de ${aba.militares.length} nomes já existem no sistema. Datas da aba: ${aba.datas.length ? fmt(aba.datas[0].iso) + ' a ' + fmt(aba.datas[aba.datas.length - 1].iso) : '—'}.</span>
    <button class="btn" onclick="S.hist=null;render()">Cancelar</button><button class="btn pri" onclick="confirmarHistorico()">Importar histórico</button></div></div>
    <h3>Prévia</h3>${tabela(aba.militares.slice(0, 8), [{ l: 'P/G', v: x => esc(x.posto) }, { l: 'Nome', v: x => esc(x.nome) }, { l: 'Situação', v: x => esc(x.situacao) },
      { l: 'No sistema', v: x => achaMilitar(x.nome, x.posto) ? '<span class="tag ok">sim</span>' : '<span class="tag warn">novo</span>' }, { l: 'Serviços na planilha', v: x => x.zeros.length, c: 'num' }])}`;
  return html;

const serialParaIso = n => { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
// Nomes na planilha às vezes trazem uma letra de controle no fim ("ÍNDERSON D", "R. SANTOS C").
const baseNome = s => norm(String(s).trim().replace(/\s+[A-Za-z]\.?$/, ''));
function achaMilitar(nome, posto) {
  const n = baseNome(nome);
  const cands = S.db.Militares.filter(m => baseNome(m.nomeGuerra) === n);
  return cands.find(m => !posto || postoNorm(posto) === m.postoGrad) || cands[0];
}
async function lerHistorico(file) {
  if (!file) return;
  try {
    toast('Lendo a planilha…');
    await carregarSheetJS();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const abas = wb.SheetNames.map(nome => {
      const linhas = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: '' });
      // Linha de cabeçalho: a que tem mais datas (números de série do Excel entre 2015 e 2045).
      let hi = -1, melhor = 0;
      linhas.slice(0, 15).forEach((l, i) => { const n = l.filter(v => typeof v === 'number' && v > 42000 && v < 53000).length; if (n > melhor) { melhor = n; hi = i; } });
      if (hi < 0 || melhor < 7) return null;
      const cab = linhas[hi];
      const datas = cab.map((v, c) => typeof v === 'number' && v > 42000 && v < 53000 ? { c, iso: serialParaIso(v) } : null).filter(Boolean);
      const cN = cab.findIndex(h => /^nome/.test(norm(h))), cP = cab.findIndex(h => ['grad', 'pg', 'posto', 'postograd', 'a'].includes(norm(h)));
      const cS = cab.findIndex(h => /situacao|obs/.test(norm(h)));
      const militares = linhas.slice(hi + 1).filter(l => String(l[cN] ?? '').trim()).map(l => ({
        nome: String(l[cN]).trim(), posto: cP >= 0 ? String(l[cP]).trim() : '', situacao: cS >= 0 ? String(l[cS]).trim() : '',
        zeros: datas.filter(d => l[d.c] === 0 || l[d.c] === '0').map(d => d.iso)
      }));
      return { nome, datas, militares };
    }).filter(Boolean);
    if (!abas.length) return toast('Não encontrei nenhuma aba com uma linha de datas (um dia por coluna).', true);
    S.hist = { arquivo: file.name, abas, aba: 0 };
    render();
  } catch (e) { toast('Erro ao ler a planilha: ' + e.message, true); }
}
async function confirmarHistorico() {
  const aba = S.hist.abas[S.hist.aba], tipoId = $('#hist_tipo').value, desde = $('#hist_desde').value, ate = $('#hist_ate').value, cadastrar = $('#hist_novos').checked;
  const novosMil = [], escala = [];
  const existe = new Set(S.db.Escala.filter(e => e.tipoId === tipoId).map(e => e.data + '|' + e.militarId));
  aba.militares.forEach(x => {
    let m = achaMilitar(x.nome, x.posto) || novosMil.find(n => norm(n.nomeGuerra) === norm(x.nome));
    if (!m) {
      if (!cadastrar) return;
      m = { id: uid(), postoGrad: postoNorm(x.posto) || x.posto, nomeGuerra: tituloNome(x.nome), ativo: 'Sim', obs: x.situacao };
      novosMil.push(m);
    }
    x.zeros.filter(d => d >= desde && d <= ate && !existe.has(d + '|' + m.id)).forEach(d => escala.push({ id: uid(), data: d, tipoId, militarId: m.id, cor: corDoDia(d), obs: 'importado' }));
  });
  if (!escala.length && !novosMil.length) return toast('Nada novo para importar nesse período.', true);
  if (!await confirmar(`Importar ${escala.length} serviço(s) de ${TIPO[tipoId].nome}${novosMil.length ? ` e cadastrar ${novosMil.length} militar(es) novo(s)` : ''}?`)) return;
  if (novosMil.length) await salvar('Militares', novosMil);
  if (escala.length) await salvar('Escala', escala);
  S.hist = null; S.sub.escala = 'folgas'; S.filtro.folgaTipo = tipoId;
  toast(`Histórico importado: ${escala.length} serviço(s).`); render();
}

// ---------- SAT (auxílio-transporte): quem recebe e os dias a descontar no mês pelos afastamentos
const SIT_SAT = ['Ativo', 'Suspenso', 'Cancelado'];
function calcSat(mes, comMissao) {
  const dias = diasDoMes(mes).filter(d => corDoDia(d) === 'P');
  return (S.db.SAT || []).filter(x => x.situacao !== 'Cancelado' || (x.fim && x.fim >= dias[0])).map(x => {
    const uteis = dias.filter(d => d >= (x.inicio || '0000') && (!x.fim || d <= x.fim));
    const fora = uteis.filter(d => { const s = situacao(x.militarId, d); return s.tipo === 'imp' || (comMissao && s.tipo === 'missao'); });
    const motivos = {}; fora.forEach(d => { const s = situacao(x.militarId, d).texto; motivos[s] = (motivos[s] || 0) + 1; });
    const direito = x.situacao === 'Suspenso' ? 0 : uteis.length - fora.length;
    return { x, uteis: uteis.length, fora: fora.length, direito, motivos, valor: num(x.valor) && uteis.length ? num(x.valor) / uteis.length * direito : 0 };
  });
}

/** Quem tira o serviço (ex.: Sargento de Dia) no dia, para o campo de assinatura. */
const nomeServico = (d, re) => { const t = tiposAtivos().find(x => re.test(x.nome)); const e = t && lancamentos(d, t.id).find(x => !emBranco(x)); return e ? nomeMil(quemTira(e)) : ''; };

// ============================================================ modelos da Cia: pernoite, pronto diário e faltas, ficha disciplinar (RDE), Nada Deve, SERMILMOB
// ---------- categorias e situação do dia (usadas no pernoite e no pronto diário)
const CATS_PERNOITE = [['ST/SARGENTOS', ['ST', '1º Sgt', '2º Sgt', '3º Sgt']], ['CABOS', ['Cb']], ['SOLDADOS', ['Sd EP', 'Sd EV', 'Sd']]];
const MOTIVOS_DESTINO = ['DISP MÉD', 'DISPENSADO', 'INSTALAÇÃO', 'CURSO', 'A DISP', 'FÉRIAS', 'VIAGEM', 'LICENÇA', 'MISSÃO', 'ADIDO', 'BAIXADO', 'IMPEDIDO'];
/** Motivos que saem sempre na folha de pernoite, mesmo sem ninguém (como no modelo). */
const MOTIVOS_FIXOS = ['DISP MÉD', 'DISPENSADO', 'CURSO', 'A DISP', 'FÉRIAS', 'VIAGEM'];
/** Onde o militar está no dia (para "em diferentes destinos"); '' = pronto. */
function destinoDoDia(m, d) {
  const adido = (S.db.Saude || []).find(x => x.tipo === 'Adido (LTSP)' && x.militarId === m.id && x.situacao !== 'Encerrado' && x.data <= d);
  if (adido) return 'ADIDO';
  const baixado = (S.db.Saude || []).find(x => { const ini = x.inicio || x.data; return x.tipo === 'Visita médica' && x.militarId === m.id && x.resultado === 'Baixado (internado)' && ini <= d && (fimDispensa({ ...x, inicio: ini }) || ini) >= d; });
  if (baixado) return 'BAIXADO';
  const s = situacao(m.id, d);
  if (s.tipo === 'pronto') return '';
  if (s.tipo === 'missao') return 'MISSÃO';
  return { 'Dispensa médica': 'DISP MÉD', 'Dispensa': 'DISPENSADO', 'Dispensa como recompensa': 'DISPENSADO', 'Dispensa para instalação': 'INSTALAÇÃO', 'Curso/Estágio': 'CURSO', 'Férias': 'FÉRIAS', 'Licença': 'LICENÇA', 'Trânsito': 'VIAGEM', 'Cumprindo punição': 'IMPEDIDO' }[s.texto] || 'A DISP';
}
const nomeCurto = m => String(m.nomeGuerra || '').toUpperCase();
/** Quadro do dia por categoria: quem está de serviço (em forma no pernoite), quantos e quem está fora. */
function quadroDia(d) {
  const servicos = tiposAtivos().flatMap(t => lancamentos(d, t.id).filter(e => !emBranco(e)).map(e => ({ sv: t.nome, m: MIL[quemTira(e)] }))).filter(x => x.m);
  return CATS_PERNOITE.map(([cat, postos]) => {
    const efetivo = militaresAtivos().filter(m => postos.includes(m.postoGrad));
    const forma = servicos.filter(x => postos.includes(x.m.postoGrad));
    const destinos = {};
    efetivo.forEach(m => { const k = destinoDoDia(m, d); if (k) (destinos[k] ||= []).push(m); });
    const fora = Object.values(destinos).reduce((s, l) => s + l.length, 0);
    // todos os serviços do dia que essa categoria pode tirar, com quem está escalado (vazio se ninguém da SU)
    const svs = tiposAtivos().filter(t => ids(t.postos).some(pg => postos.includes(pg)) && (aplica(t, d) || lancamentos(d, t.id).length))
      .map(t => ({ sv: t.nome, nomes: forma.filter(x => x.sv === t.nome).map(x => nomeCurto(x.m)) }));
    return { cat, efetivo: efetivo.length, forma, servicos: svs, dispensados: Math.max(0, efetivo.length - forma.length), destinos, fora, prontos: efetivo.length - fora };
  });
}

// ---------- folha de pernoite no modelo da Cia: EM FORMA (serviço) × dispensados da revista, e EM DIFERENTES DESTINOS
DOCS.pernoite = d => {
  const q = quadroDia(d), ex = extrasPernoite(d);
  const titulo = `PERNOITE PARA DIA ${pad(Number(d.slice(8)))} DE ${MESES_EXT[Number(d.slice(5, 7)) - 1].toUpperCase()} DE ${d.slice(0, 4)} (${SEMANA[dataDe(d).getDay()].toUpperCase()})`;
  // uma linha por categoria: os serviços um embaixo do outro e, ao lado, os nomes na mesma altura
  const cel = l => ({ v: l.map(x => x || '\u00a0').join('\n'), l: 1 });
  const t1 = [['', { v: 'EM FORMA', span: 2 }, 'DISPENSADOS DA REVISTA', 'SOMA']];
  q.forEach(c => { const l = c.servicos.length ? c.servicos : [{ sv: '—', nomes: [] }];
    t1.push([{ v: c.cat, b: 1 }, cel(l.map(x => x.sv.toUpperCase())), cel(l.map(x => x.nomes.join(' - '))), String(c.dispensados), String(c.efetivo)]); });
  if (ex.length) t1.push([{ v: 'OUTRA SU', b: 1 }, cel(ex.map(x => String(x.sv || '').toUpperCase())), cel(ex.map(x => `${x.nome}${x.su ? ' (' + x.su + ')' : ''}`)), '', '']);
  const tot = q.reduce((s, c) => ({ f: s.f + c.forma.length, d: s.d + c.dispensados, e: s.e + c.efetivo, fo: s.fo + c.fora, p: s.p + c.prontos }), { f: 0, d: 0, e: 0, fo: 0, p: 0 });
  t1.push([{ v: 'SOMA', b: 1 }, { v: String(tot.f + ex.length), b: 1, span: 2 }, { v: String(tot.d), b: 1 }, { v: String(tot.e), b: 1 }]);
  const t2 = [['', { v: 'EM DIFERENTES DESTINOS', span: 2 }, 'PRESENTES', 'SOMA']];
  q.forEach(c => { const ks = MOTIVOS_DESTINO.filter(k => MOTIVOS_FIXOS.includes(k) || c.destinos[k]);
    t2.push([{ v: c.cat, b: 1 }, cel(ks.map(k => k + ':')), cel(ks.map(k => (c.destinos[k] || []).map(nomeCurto).join(' - '))), String(c.prontos), String(c.efetivo)]); });
  t2.push([{ v: 'SOMA', b: 1 }, { v: String(tot.fo), b: 1, span: 2 }, { v: String(tot.p), b: 1 }, { v: String(tot.e), b: 1 }]);
  t2.push([{ v: 'TOTAL\n(ESTADO EFETIVO)', b: 1 }, { v: '', span: 3 }, { v: String(Math.max(0, tot.d - tot.fo)), b: 1 }]);
  return { tipo: 'Escalas', titulo: `Pernoite ${d}`, blocos: [...blocosCabecalho(),
    { t: [[{ v: `${String(cfg('cmtNome')).toUpperCase()}\n${String(cfg('cmtFuncao')).toUpperCase()} ${String(cfg('sigla')).toUpperCase()}`, b: 1 }, { v: titulo, b: 1 }]], w: [26, 74], sz: 9 },
    { t: t1, h: 1, w: [16, 28, 32, 14, 10], sz: 8 }, { esp: 1 }, { t: t2, h: 1, w: [16, 28, 32, 14, 10], sz: 8 },
    ...blocosAssinatura(cfg('sgteNome'), `Sgtte ${cfg('sigla')}`)] };
};

// ============================================================ funções da Cia (quem faz o quê), aniversariantes, processos, protocolo SPED e partes do Cmt
// Atribuições conforme a distribuição do Cmt Cia. A lista padrão aparece sem gravar nada; o que for editado fica na tabela Funcoes.
const FUNCOES_PADRAO = [
  ['cmt', 'Cmt Cia', '', 'Parte pessoal\nParte de inteligência\nRetirada de faltas\nFormaturas da Cia\nAtualização do tripão\nSolicitação de material de consumo e permanente para as dependências e Pel'],
  ['sgtte', 'Sargenteante', 'cmt', 'SISBOL\nSPED\nExercícios anteriores\nTrâmites de FATD\nCoordenar os auxiliares'],
  ['encmat', 'Enc Mat', 'cmt', 'Inventário e relação carga\nCautelas\nPedidos de material ao Fisc Adm / S4\nControle das dependências'],
  ['auxsgtte', 'Aux Sgtte', 'sgtte', 'SISBOL\nSPED\nExercícios anteriores\nTrâmites de FATD'],
  ['auxalt', 'Aux Alterações', 'sgtte', 'Alterações\nSUCEMNet / Mapa da Força / pronto diário\nEscala de serviço\nAniversariantes'],
  ['auxfur', 'Aux Furriel', 'sgtte', 'Despesa a anular\nPré-escolar\nDeclaração de beneficiário\nPecuniária\nVale-rancho\nSaúde e PHPM']
].map(([id, nome, chefe, atrib], i) => ({ id, nome, chefe, atrib, ordem: i + 1, padrao: 1 }));
/** Lista padrão com o que foi gravado por cima, mais as funções criadas pelo usuário; as apagadas ficam ocultas. */
const funcoes = () => {
  const g = S.db.Funcoes || [];
  return [...FUNCOES_PADRAO.map(f => ({ ...f, ...(g.find(x => x.id === f.id) || {}) })), ...g.filter(x => !FUNCOES_PADRAO.some(f => f.id === x.id))]
    .filter(f => f.oculto !== 'Sim').sort((a, b) => num(a.ordem) - num(b.ordem));
};
/** Quem ocupa: o que foi marcado, senão o militar com essa função no cadastro. */
const ocupante = f => f.ocupanteId && MIL[f.ocupanteId] ? MIL[f.ocupanteId] : militaresAtivos().find(m => m.funcao && norm(m.funcao) === norm(f.nome));
function vFuncoes() {
  const l = funcoes(), filhos = id => l.filter(f => (f.chefe || '') === id && f.id !== id);
  const card = f => { const m = ocupante(f);
    return `<div class="card qf-c"><div class="bar" style="margin:0 0 6px"><b class="grow">${esc(f.nome)}</b>${pode() ? `<button class="btn sm" onclick="editarFuncao('${f.id}')">Editar</button>` : ''}</div>
      <div>${m ? `<b>${esc(nomeMil(m))}</b>` : '<span class="tag warn">sem militar</span>'}</div>
      <ul class="qf-l">${String(f.atrib || '').split('\n').filter(Boolean).map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>`; };
  const ramo = f => `<div class="qf-r">${card(f)}${filhos(f.id).length ? `<div class="qf-f">${filhos(f.id).map(ramo).join('')}</div>` : ''}</div>`;
  const raizes = l.filter(f => !f.chefe || !l.some(x => x.id === f.chefe));
  return `<div class="bar"><span class="muted grow">Quem faz o quê na Cia. O militar sai do campo "Função" do cadastro, ou escolha em Editar.</span>${pode() ? '<button class="btn" onclick="editarFuncao()">+ Função</button>' : ''}${botoesDocGrandes('funcoes', '')}</div>
    <div class="qf">${raizes.map(ramo).join('')}</div>`;
}
function editarFuncao(id) {
  const f = id ? funcoes().find(x => x.id === id) : { id: 'f' + Date.now().toString(36), ordem: funcoes().length + 1, chefe: 'sgtte' };
  abrirForm({ titulo: id ? 'Função: ' + f.nome : 'Nova função', valores: f, campos: [{ k: 'nome', l: 'Função', req: true }, { k: 'ocupanteId', l: 'Militar (vazio = pelo cadastro)', t: 'militar' },
    { k: 'chefe', l: 'Subordinada a', t: 'select', o: funcoes().filter(x => x.id !== f.id).map(x => [x.id, x.nome]) }, { k: 'ordem', l: 'Ordem', t: 'number' },
    { k: 'atrib', l: 'Atribuições (uma por linha)', t: 'textarea', full: true }],
    aoSalvar: o => salvar('Funcoes', [{ id: f.id, nome: o.nome, ocupanteId: o.ocupanteId, chefe: o.chefe, ordem: o.ordem, atrib: o.atrib, oculto: '' }]),
    extra: id ? `<div class="acts" style="justify-content:flex-start"><button type="button" class="btn sm dng" onclick="ocultarFuncao('${id}')">Tirar esta função</button></div>` : '' });
}
async function ocultarFuncao(id) {
  if (!await confirmar('Tirar esta função do quadro?')) return;
  const f = funcoes().find(x => x.id === id); fecharModal();
  await salvar('Funcoes', [{ id, nome: f.nome, chefe: f.chefe, ordem: f.ordem, atrib: f.atrib, ocupanteId: f.ocupanteId || '', oculto: 'Sim' }]); render();
}
DOCS.funcoes = () => docPadrao({ tipo: 'Efetivo', nome: `Quadro de funcoes ${hoje()}`, titulo: `QUADRO DE FUNÇÕES DA ${String(cfg('sigla')).toUpperCase()}`, cab: ['Função', 'Militar', 'Subordinada a', 'Atribuições'],
  linhas: funcoes().map(f => [{ v: f.nome, b: 1, l: 1 }, { v: ocupante(f) ? nomeMil(ocupante(f)) : '', l: 1 }, (funcoes().find(x => x.id === f.chefe) || {}).nome || '', { v: String(f.atrib || '').split('\n').filter(Boolean).map(a => '- ' + a).join('\n'), l: 1 }]),

// ---------- PHPM: pasta do militar, que precisa estar sempre atualizada. Guarda a data da última atualização de cada um.
const mesesPhpm = () => num(cfg('phpmMeses')) || 12;
const phpmDe = mid => (S.db.PHPM || []).find(x => x.id === mid) || {};
/** 'ok' | 'vence' (nos próximos 30 dias) | 'vencida' | 'sem' */
function sitPhpm(mid) {
  const x = phpmDe(mid); if (!x.data) return 'sem';
  const lim = addDias(x.data, Math.round(mesesPhpm() * 30.4)), d = hoje();
  return lim < d ? 'vencida' : lim < addDias(d, 30) ? 'vence' : 'ok';
}
const TAG_PHPM = { ok: ['ok', 'em dia'], vence: ['warn', 'vence em 30 dias'], vencida: ['dng', 'desatualizada'], sem: ['dng', 'sem registro'] };
function vPhpm() {
  const ver = S.filtro.phpmVer || 'pend', l = militaresAtivos().filter(m => (ver === 'todos' || sitPhpm(m.id) !== 'ok') && casa('phpmq', nomeMil(m)));
  const n = k => militaresAtivos().filter(m => sitPhpm(m.id) === k).length;
  return `<div class="cards">${['ok', 'vence', 'vencida', 'sem'].map(k => `<div class="card"><h4>${TAG_PHPM[k][1]}</h4><div class="big"><span class="tag ${TAG_PHPM[k][0]}" style="font-size:26px;padding:2px 14px">${n(k)}</span></div></div>`).join('')}</div>
    <div class="bar">${busca('phpmq', 'Buscar militar…')}<select onchange="S.filtro.phpmVer=this.value;render()" aria-label="Quais"><option value="pend">Só as que precisam atualizar</option><option value="todos" ${ver === 'todos' ? 'selected' : ''}>Todo o efetivo</option></select><span class="grow"></span>${botoesDocGrandes('phpm', '')}</div>
    ${tabela(l, [{ l: 'Militar', v: m => `<b>${esc(nomeMil(m))}</b>` }, { l: 'Última atualização', v: m => fmt(phpmDe(m.id).data) || '<span class="muted">—</span>', s: m => phpmDe(m.id).data || '' },
      { l: 'Situação', v: m => `<span class="tag ${TAG_PHPM[sitPhpm(m.id)][0]}">${TAG_PHPM[sitPhpm(m.id)][1]}</span>` }, { l: 'Obs', v: m => esc(phpmDe(m.id).obs || '') }],
      pode() ? m => `<button class="btn sm pri" onclick="phpmHoje('${m.id}')">Atualizada hoje</button> <button class="btn sm" onclick="editarPhpm('${m.id}')">Editar</button>` : null)}
    <p class="muted">Conta ${mesesPhpm()} meses desde a última atualização (muda em Configurações). Atualize também quando houver mudança: casamento, filho, endereço, beneficiário.</p>`;
}
async function phpmHoje(mid) { await salvar('PHPM', [{ ...phpmDe(mid), id: mid, data: hoje() }]); toast('PHPM de ' + nomeMil(mid) + ' atualizada.'); render(); }
function editarPhpm(mid) {
  abrirForm({ titulo: 'PHPM – ' + nomeMil(mid), valores: { ...phpmDe(mid), id: mid }, campos: [{ k: 'data', l: 'Última atualização', t: 'date' }, { k: 'obs', l: 'Observação (o que mudou, o que falta)', full: true }],
    aoSalvar: o => salvar('PHPM', [{ ...o, id: mid }]) });
}
DOCS.phpm = () => docPadrao({ tipo: 'Efetivo', nome: `PHPM ${hoje()}`, titulo: 'CONTROLE DE ATUALIZAÇÃO DA PHPM', cab: ['Nº', 'P/G', 'Nome de guerra', 'Última atualização', 'Situação', 'Obs'],
  linhas: militaresAtivos().map((m, i) => [pad(i + 1), m.postoGrad, { v: m.nomeGuerra, l: 1 }, fmt(phpmDe(m.id).data), TAG_PHPM[sitPhpm(m.id)][1], { v: phpmDe(m.id).obs || '', l: 1 }]), w: [6, 10, 26, 16, 18, 24], sz: 9 });

const TIPOS_TS = ['Engajamento', 'Reengajamento', 'Prorrogação de tempo de serviço', 'Licenciamento'];
const SIT_TS = ['Em andamento', 'Deferido', 'Indeferido'];
/** Temporário: marcado no cadastro, ou cabo/soldado sem vínculo informado. */
const temporario = m => m.vinculo ? m.vinculo === 'Temporário' : postoIdx(m.postoGrad) >= POSTOS.indexOf('Cb');
const processosTs = mid => (S.db.TempoServico || []).filter(x => x.militarId === mid).sort((a, b) => String(b.inicio || b.requerimento).localeCompare(a.inicio || a.requerimento));
/** Até quando o militar tem tempo: o fim do último engajamento/prorrogação deferido; sem isso, Sd EV = 12 meses da praça. */
function terminoTs(m) {
  const def = processosTs(m.id).filter(x => x.situacao === 'Deferido' && x.fim && x.tipo !== 'Licenciamento').map(x => x.fim).sort().pop();
  if (def) return def;
  if (m.postoGrad === 'Sd EV' && m.dataPraca) { const d = dataDe(m.dataPraca); d.setFullYear(d.getFullYear() + 1); return addDias(isoDe(d), -1); }
  return m.termino || '';
}
const avisoTs = () => num(cfg('avisoEngaj')) || 90;
function linhasTs() {
  return militaresAtivos().filter(temporario).map(m => {
    const fim = terminoTs(m), resta = fim ? diasEntre(hoje(), fim) - 1 : null, andamento = processosTs(m.id).find(x => x.situacao === 'Em andamento');
    return { m, fim, resta, andamento, tempo: m.dataPraca ? amdTxt(amd(diasCorridos(m.dataPraca, hoje()))) : '' };
  }).sort((a, b) => (a.resta ?? 99999) - (b.resta ?? 99999));
}
const tagResta = r => r.resta === null ? '<span class="muted">sem término</span>' : `<span class="tag ${r.resta < 0 ? 'dng' : r.resta <= 30 ? 'dng' : r.resta <= avisoTs() ? 'warn' : 'ok'}">${r.resta < 0 ? `vencido há ${-r.resta} dia(s)` : `${r.resta} dia(s)`}</span>`;
function vTempoServico() {
  const ver = S.filtro.tsVer || 'todos';

  if (ver === 'aviso') l = l.filter(r => r.resta !== null && r.resta <= avisoTs());
  return `<div class="bar"><select onchange="S.filtro.tsVer=this.value;render()" aria-label="Quais"><option value="todos">Todos os temporários</option><option value="aviso" ${ver === 'aviso' ? 'selected' : ''}>Só quem vence em até ${avisoTs()} dias</option></select>
      <span class="grow"></span>${botoesDocGrandes('tempoServico', '', 'tempoServico')}</div>
    ${tabela(l, [{ l: 'Militar', v: r => `<b>${esc(nomeMil(r.m))}</b>` }, { l: 'Praça', v: r => fmt(r.m.dataPraca) || '<span class="muted">—</span>', s: r => r.m.dataPraca || '' },
      { l: 'Tempo de serviço', v: r => r.tempo || '<span class="muted">sem data de praça</span>' }, { l: 'Término do tempo atual', v: r => fmt(r.fim) || '<span class="muted">—</span>', s: r => r.fim || '9' },
      { l: 'Falta', v: tagResta, s: r => r.resta ?? 99999 },
      { l: 'Processo', v: r => r.andamento ? `${esc(r.andamento.tipo)}<div class="muted">${[r.andamento.requerimento && 'req. ' + fmt(r.andamento.requerimento), r.andamento.is && 'IS ' + r.andamento.is, r.andamento.bi].filter(Boolean).map(esc).join(' · ') || 'iniciado'}</div>` : r.resta !== null && r.resta <= avisoTs() ? '<span class="tag warn">iniciar</span>' : '' }],
      pode() ? r => `<button class="btn sm" onclick="editarTs(null,'${r.m.id}')">+ Processo</button> <button class="btn sm" onclick="historicoTs('${r.m.id}')">Histórico</button> <button class="btn sm" onclick="kitLicenciamento('${r.m.id}')" title="SERMILMOB, Nada Deve e Ficha Disciplinar">Licenciamento</button>` : null)}
    <p class="muted">Temporários: quem está marcado assim no cadastro (ou cabo e soldado sem vínculo informado). O término vem do último engajamento ou prorrogação <b>deferido</b>; sem ele, o Sd EV conta 12 meses da praça. O aviso começa ${avisoTs()} dias antes (muda em Configurações). Guarde na pasta os requerimentos, a IS e a cópia do BI.</p>`;
}
function editarTs(id, mid) {
  const x = id ? S.db.TempoServico.find(y => y.id === id) : { militarId: mid, tipo: 'Prorrogação de tempo de serviço', situacao: 'Em andamento', requerimento: hoje(), inicio: mid && terminoTs(MIL[mid]) ? addDias(terminoTs(MIL[mid]), 1) : '' };
