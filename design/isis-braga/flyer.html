<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Gloock';src:url('fonts/Gloock-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'ISerif';src:url('fonts/InstrumentSerif-Italic.ttf') format('truetype');font-style:italic}
@font-face{font-family:'WS';src:url('fonts/WorkSans-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'PM';src:url('fonts/IBMPlexMono-Regular.ttf') format('truetype');font-weight:400}

:root{
  --paper:#F2EDE1;
  --ink:#191714;
  --soft:#5C554A;
  --rule:#C9BDA6;
  --rule-fine:#D7CDB9;
  --accent:#7B3B2E;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:var(--paper);-webkit-font-smoothing:antialiased;font-kerning:normal;text-rendering:geometricPrecision}

.sheet{position:relative;width:1080px;height:1350px;overflow:hidden}
.tone{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(125% 62% at 50% -4%, rgba(255,252,244,.9) 0%, rgba(255,252,244,0) 60%),
    radial-gradient(130% 70% at 50% 112%, rgba(122,100,66,.09) 0%, rgba(122,100,66,0) 64%)}
.grain{position:absolute;inset:-12px;opacity:.05;mix-blend-mode:multiply;pointer-events:none}
.keyline{position:absolute;left:38px;top:38px;right:38px;bottom:38px;border:1px solid var(--rule-fine);pointer-events:none}
.tick{position:absolute;pointer-events:none}
.tick i{position:absolute;background:var(--accent);opacity:.6}
.tick i.h{width:15px;height:1px} .tick i.v{width:1px;height:15px}
.t1{left:38px;top:38px}   .t2{left:1027px;top:38px}
.t3{left:38px;top:1297px} .t4{left:1027px;top:1297px}
.t2 i.h{right:0} .t2 i.v{right:0}
.t3 i.h{bottom:0} .t3 i.v{bottom:0}
.t4 i.h{right:0;bottom:0} .t4 i.v{right:0;bottom:0}

.stage{position:absolute;inset:0;padding:94px 96px 76px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between}

/* masthead */
.masthead{width:100%;text-align:center}
.name{font-family:'Gloock',serif;font-size:138px;line-height:1.0;color:var(--ink);
  letter-spacing:-.005em;white-space:nowrap}
.orn{display:flex;align-items:center;justify-content:center;margin:34px 0 36px}
.orn .d{width:6px;height:6px;background:var(--accent);transform:rotate(45deg)}
.band{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:26px 0 28px}
.headline{font-family:'WS',sans-serif;font-weight:400;font-size:61px;line-height:1.3;
  text-transform:uppercase;letter-spacing:.155em;color:var(--ink);
  text-indent:.155em;white-space:nowrap}

/* index */
.index{width:100%}
.cap{font-family:'PM',monospace;font-size:15px;letter-spacing:.38em;text-transform:uppercase;
  color:var(--soft);margin-bottom:24px}
.row{display:flex;align-items:baseline;gap:30px;padding:20px 2px 19px;border-top:1px solid var(--rule-fine)}
.row:last-of-type{border-bottom:1px solid var(--rule-fine)}
.num{font-family:'PM',monospace;font-size:19px;color:var(--accent);letter-spacing:.05em;width:34px;flex:none}
.svc{font-family:'WS',sans-serif;font-size:42px;line-height:1.05;color:var(--ink);letter-spacing:.002em;white-space:nowrap}

/* plate + footer */
.plate{display:flex;justify-content:center;width:100%}
.footer{width:100%;text-align:center}
.frules{height:5px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);margin-bottom:30px;opacity:.9}
.cta{font-family:'ISerif',serif;font-style:italic;font-size:50px;line-height:1.12;color:var(--ink);white-space:nowrap}
</style></head><body>

  <div class="keyline"></div>
  <div class="tick t1"><i class="h"></i><i class="v"></i></div>
  <div class="tick t2"><i class="h"></i><i class="v"></i></div>
  <div class="tick t3"><i class="h"></i><i class="v"></i></div>
  <div class="tick t4"><i class="h"></i><i class="v"></i></div>

</body></html>
