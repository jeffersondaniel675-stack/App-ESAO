<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:'IS';src:url('fonts/InstrumentSans-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'IS';src:url('fonts/InstrumentSans-Bold.ttf') format('truetype');font-weight:700}
:root{--paper:#F4F2ED;--ink:#16171A;--red:#D6402A;--rule:#C7C3B9;--bar:#C0BCB0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:var(--paper);font-family:'IS',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.sheet{position:relative;width:1080px;height:1350px;overflow:hidden}
.grain{position:absolute;inset:-10px;opacity:.035;mix-blend-mode:multiply;pointer-events:none}
.hair{position:absolute;left:90px;width:900px;height:1px;background:var(--ink);opacity:.9}
.rule{position:absolute;left:90px;width:900px;height:1px;background:var(--rule)}
.heavy{position:absolute;left:90px;width:900px;height:3px;background:var(--ink)}
.fb{position:absolute;height:3px;background:var(--bar)}
.accent{position:absolute;left:90px;width:222px;height:8px;background:var(--red)}
.name{position:absolute;left:84.5px;top:108px;font-size:64px;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.hero{position:absolute;left:85.0px;top:240px;font-weight:700;font-size:104px;line-height:1.15;
  letter-spacing:-.026em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.label{position:absolute;left:90px;top:630px;font-size:15px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--red);font-weight:700}
.row{position:absolute;left:90px;width:900px;display:flex;align-items:baseline}
.num{width:154px;flex:none;font-size:20px;letter-spacing:.04em;color:var(--red);font-weight:700}
.svc{font-size:44px;line-height:1.05;letter-spacing:-.008em;color:var(--ink);white-space:nowrap}
.cta{position:absolute;left:87.5px;top:1212px;font-weight:700;font-size:48px;line-height:1;
  letter-spacing:-.015em;color:var(--ink);white-space:nowrap}
</style></head><body>
<div class="sheet">
  <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  <div class="hair" style="top:90px"></div>
  <div class="name">Isis Braga</div>
  <div class="hero">Formatação<br>Acadêmica</div>
  <div class="accent" style="top:540px"></div>
  <div class="fb" style="top:504px;left:552.0px;width:438.0px"></div><div class="fb" style="top:515px;left:552.0px;width:438.0px"></div><div class="fb" style="top:526px;left:552.0px;width:411.7px"></div><div class="fb" style="top:537px;left:552.0px;width:438.0px"></div><div class="fb" style="top:548px;left:552.0px;width:385.4px"></div><div class="fb" style="top:559px;left:552.0px;width:438.0px"></div><div class="fb" style="top:570px;left:552.0px;width:424.9px"></div><div class="fb" style="top:581px;left:552.0px;width:166.4px"></div>
  <div class="label">Serviços</div>
  <div class="rule" style="top:666px"></div><div class="row" style="top:688px"><span class="num">01</span><span class="svc" style="margin-left:-1.5px">TCC</span></div><div class="rule" style="top:766px"></div><div class="row" style="top:788px"><span class="num">02</span><span class="svc" style="margin-left:-4.0px">Projeto Mário Travassos</span></div><div class="rule" style="top:866px"></div><div class="row" style="top:888px"><span class="num">03</span><span class="svc" style="margin-left:-4.0px">Projeto de pesquisa de mestrado</span></div><div class="rule" style="top:966px"></div><div class="row" style="top:988px"><span class="num">04</span><span class="svc" style="margin-left:-4.0px">Projeto de pesquisa de TCC</span></div><div class="rule" style="top:1066px"></div>
  <div class="heavy" style="top:1176px"></div>
  <div class="cta">Solicite seu orçamento</div>
</div>
</body></html>
